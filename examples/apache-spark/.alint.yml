# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# PROPOSED v0.11 alint config for apache/spark.
# =============================================
#
# This is a v0.11 RE-ANALYSIS of examples/apache-spark/.alint.yml. It
# preserves every rule the prior config could express and then UPGRADES
# the rules that previously fell back to fragile workarounds, using the
# capabilities alint shipped in v0.10 + v0.11:
#
#   v0.10:  xml_path_equals / xml_path_matches  (the pom.xml win)
#           registry_paths_resolve              (dev/.rat-excludes)
#           generated_file_fresh                (codegen/lockfile freshness)
#           apache/governance@v1 bundled ruleset
#   v0.11:  import_gate                         (scalastyle IllegalImports)
#           ordered_block                       (keep-sorted registries)
#           command_idempotent                  (the lint-* / dep / proto checks)
#           git_commit_no_fixup                 (PR hygiene)
#
# Repo state captured: 2026-05-25, depth-1 clone of apache/spark master.
# Concrete count at HEAD:
#   - 49 pom.xml; root parent POM declares 48 <module> entries
#   - <parent> = org.apache:apache:34; <groupId> = org.apache.spark
#   - <java.version> = 17; <scala.binary.version> = 2.13
#   - 63 GitHub Actions workflows under .github/workflows/
#   - 6 dev/lint-* orchestrators + dev/check-license (Apache RAT)
#   - dev/.rat-excludes = 145 patterns
#   - 4 in-tree languages: Scala (core), Java (common/*, launcher/),
#     Python (PySpark, 3 PyPI variants), R (SparkR → CRAN)
#   - two-tier LICENSE/NOTICE discipline (LICENSE-binary, NOTICE-binary,
#     licenses-binary/)
#   - NO DCO/Signed-off-by discipline (Spark gates on JIRA + the
#     dev/merge_spark_pr.py merge script, not sign-off trailers) — so
#     git_commit_signed_off is deliberately NOT used here; only the
#     universal git_commit_no_fixup PR-hygiene rule applies.
#
# What this config still does NOT replace (keep the existing tool):
#   - scalastyle / scalafmt   (Scala AST + style)
#   - checkstyle              (Java AST + style)
#   - ruff/black/mypy/flake8  (Python AST + style + types)
#   - lintr                   (R AST)
#   - eslint                  (JS AST)
#   - apache-rat              (binary license classification — Java jar)
#   - mima                    (Scala .class binary-compat AST)
#   - buf breaking-changes    (proto AST)
#   - dev/structured_logging_style.py (Scala-AST custom convention)
#   - dev/check_pyspark_custom_errors.py (Python-AST + error-registry)
# These remain wrapped via command:/command_idempotent shellouts so a
# single `alint check` drives the whole pipeline.

version: 1

extends:
  # OSS hygiene baseline (README, no merge markers, no bidi, etc.).
  - alint://bundled/oss-baseline@v1

  # ── v0.10 WIN: apache/governance@v1 ────────────────────────────────
  # NEW in this re-analysis. The prior config hand-rolled ~11 spark-asf-*
  # / spark-license-* / spark-rat-* / spark-check-license-* /
  # spark-create-release-* / spark-merge-script-* rules. The bundled
  # apache/governance@v1 ruleset now consolidates the Apache-TLP
  # governance superset (LICENSE + NOTICE incl. ASF-attribution-line +
  # KEYS + RAT source-header + no-binaries-in-source + README +
  # changelog). Composes cleanly with compliance/apache-2@v1 (no id
  # collision). One extends: line replaces a dozen hand-rolled entries.
  - alint://bundled/apache/governance@v1

  # Apache-2.0 source-header compliance. The bundled header pattern
  # broadened to the long ASF-preamble form in v0.9.18, so no pattern
  # override is needed — only the spark file-extension extension below.
  - alint://bundled/compliance/apache-2@v1

  # Java / Maven tier. pom.xml at root, build wrapper, **/target/ +
  # **/*.class guard, PascalCase *.java, source hygiene scoped via
  # has_ancestor: pom.xml.
  - alint://bundled/java@v1

  # Python tier — PySpark under python/, gated via has_ancestor:
  # pyproject.toml / setup.py (so dev/*.py scripts are not treated as
  # a package).
  - alint://bundled/python@v1

  # GitHub Actions hardening (workflow permissions, action SHA pinning,
  # top-level name:). 63 workflows = large supply-chain blast radius.
  - alint://bundled/ci/github-actions@v1

  # Cross-language tracked-artefact hygiene.
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ═══════════════════════════════════════════════════════════════════
  # 1. Apache source header — extend the bundled compliance/apache-2
  #    header to the spark file-extension set (.scala/.r/.R/.proto are
  #    spark-specific). Long ASF-preamble is the bundled default since
  #    v0.9.18, so only the extension list + RAT-exclude allowlist
  #    remain spark-local.
  # ═══════════════════════════════════════════════════════════════════
  - id: apache-2-source-has-license-header
    kind: file_header
    paths:
      include: ["**/*.{scala,java,py,r,R,js,jsx,ts,tsx,sh,xml,proto}"]
      exclude:
        - "**/target/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/node_modules/**"
        - "**/generated/**"
        - "**/*.min.js"
        - "python/pyspark/cloudpickle/**"
        - "python/pyspark/sql/connect/proto/**"
        - "python/pyspark/sql/streaming/proto/**"
        - "python/pyspark/loose_version.py"
        - "python/pyspark/errors/exceptions/tblib.py"
        - "core/src/main/resources/org/apache/spark/ui/static/vis-*"
        - "core/src/main/resources/org/apache/spark/ui/static/dataTables*"
        - "core/src/main/resources/org/apache/spark/ui/static/jquery*"
        - "core/src/main/resources/org/apache/spark/ui/static/bootstrap*"
        - "core/src/main/resources/org/apache/spark/ui/static/d3*"
        - "core/src/main/resources/org/apache/spark/ui/static/dagre*"
        - "core/src/main/resources/org/apache/spark/ui/static/sorttable.js"
        - "core/src/main/resources/org/apache/spark/ui/static/graphlib*"
        - "**/SparkILoop.scala"
        - "**/LimitedInputStream.java"
        - "**/TimSort.java"
        - "**/Murmur3_x86_32.java"
    lines: 30
    pattern: 'Licensed (to the Apache Software Foundation|under the Apache License,?\s*Version 2)'
    level: warning
    message: >-
      Apache-2.0: source files must carry an Apache license header
      (the long ASF-preamble form). Enforced at release-vote time by
      Apache RAT via dev/check-license.
    policy_url: "https://www.apache.org/licenses/LICENSE-2.0#apply"

  # ═══════════════════════════════════════════════════════════════════
  # 2. Maven multi-module integrity — the v0.10 xml_path_* WIN.
  #    The prior config used file_content_matches regex against the raw
  #    pom.xml TEXT (fragile: whitespace, attribute reorder, comments,
  #    CDATA all defeat a line regex). v0.10 xml_path_* parses the XML
  #    into the xmltodict value tree, so these become STRUCTURAL.
  #    pom.xml root element is <project>, so paths start at $.project.
  # ═══════════════════════════════════════════════════════════════════

  # Root POM must inherit the Apache parent (org.apache:apache:NN).
  # OLD: file_content_matches '(?s)<parent>\s*<groupId>org\.apache...'
  # NEW: structural — the parent's artifactId element.
  - id: spark-root-pom-apache-parent
    kind: xml_path_equals
    paths: pom.xml
    path: "$.project.parent.artifactId"
    equals: "apache"
    level: error
    message: >-
      The root pom.xml MUST inherit from the Apache parent POM
      (org.apache:apache:NN) — this propagates the Apache release-
      deployment plugin set, source-assembly descriptor and GPG signing
      to every submodule. xml_path_* (v0.10) checks the structural
      element, not a brittle text regex.
    policy_url: "https://maven.apache.org/pom/asf/"

  - id: spark-root-pom-apache-parent-group
    kind: xml_path_equals
    paths: pom.xml
    path: "$.project.parent.groupId"
    equals: "org.apache"
    level: error
    message: >-
      The root pom.xml <parent><groupId> MUST be org.apache.

  # Root <groupId> = org.apache.spark.
  # OLD: file_content_matches '(?s)<groupId>org\.apache\.spark</groupId>'
  - id: spark-root-pom-groupid
    kind: xml_path_equals
    paths: pom.xml
    path: "$.project.groupId"
    equals: "org.apache.spark"
    level: error
    message: >-
      Root pom.xml <groupId> MUST be org.apache.spark (Maven Central
      namespace governance assigns this to the Spark PMC).

  # NEW capability entirely — was not expressible at all before xml_path_*.
  # Pin the JVM target the whole reactor inherits. java.version has a dot
  # in the key, so bracket-notation per the structured-query convention.
  - id: spark-root-pom-java-version
    kind: xml_path_matches
    paths: pom.xml
    path: "$.project.properties['java.version']"
    matches: '^(17|21|25)$'
    level: warning
    message: >-
      Root pom.xml <java.version> pins the JVM bytecode target every
      submodule inherits (maven.compiler.release = ${java.version}).
      Drift here silently changes the published-artefact baseline.

  # Maven Central publishing identity — the parent artifactId encodes
  # the Scala binary version (spark-parent_2.13). Structural match.
  - id: spark-root-pom-parent-artifact-naming
    kind: xml_path_matches
    paths: pom.xml
    path: "$.project.artifactId"
    matches: '^spark-parent_2\.1[0-9]$'
    level: warning
    message: >-
      Root pom.xml <artifactId> is spark-parent_<scala.binary.version>
      (e.g. spark-parent_2.13). dev/change-scala-version.sh rewrites
      this; a mismatch means the cross-build is half-applied.

  - id: spark-root-pom-present
    kind: file_exists
    paths: pom.xml
    root_only: true
    level: error
    message: >-
      pom.xml at the repo root is the parent POM declaring all 48 Maven
      submodules + dependency/plugin management.

  # Top-level Maven module dirs each carry a pom.xml (unchanged from
  # prior config — for_each_dir presence is still the right shape; the
  # "every <module> entry resolves" inverse is now ALSO checkable via
  # registry_paths_resolve below).
  - id: spark-maven-top-modules-have-pom
    kind: for_each_dir
    select: "{core,mllib,mllib-local,graphx,streaming,launcher,examples,assembly,repl,tools}"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    level: error
    message: >-
      Every top-level Maven module subdirectory must declare a pom.xml.

  - id: spark-sql-sublibrary-has-pom
    kind: for_each_dir
    select: "sql/{api,catalyst,core,hive,hive-thriftserver,pipelines}"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    level: error
    message: >-
      Every top-level Maven module under sql/ is independently declared
      in the root pom.xml <modules> section.

  - id: spark-sql-connect-sublibrary-has-pom
    kind: for_each_dir
    select: "sql/connect/{server,common,shims}"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    level: error
    message: >-
      Every Maven module under sql/connect/ is independently declared.

  - id: spark-common-sublibrary-has-pom
    kind: for_each_dir
    select: "common/*"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    when_iter: 'iter.is_dir'
    level: error
    message: >-
      Every sub-library under common/ is an independent Maven module
      and MUST declare its own pom.xml.

  - id: spark-connector-sublibrary-has-pom
    kind: for_each_dir
    select: "connector/*"
    require:
      - kind: file_exists
        paths: "{path}/pom.xml"
    when_iter: 'iter.is_dir'
    level: error
    message: >-
      Every sub-library under connector/ is an independent Maven module
      under a profile-conditional <modules> block.

  # ═══════════════════════════════════════════════════════════════════
  # 3. dev/.rat-excludes path-registry — the v0.10 registry_paths_resolve
  #    WIN. The prior config could only assert presence + a min-line
  #    count. registry_paths_resolve reads the exclude list as a
  #    path/glob registry and asserts each pattern resolves to ≥1 on-disk
  #    file — catching stale exclude entries that quietly accumulate.
  #    This ALSO doubles as the source-of-the-78-false-positive fix from
  #    the prior README: the same exclude registry the header rule needs.
  # ═══════════════════════════════════════════════════════════════════
  - id: spark-rat-excludes-resolve
    kind: registry_paths_resolve
    source: dev/.rat-excludes
    extract: { lines: {} }
    entries_are_globs: true
    level: warning
    message: >-
      Every pattern in dev/.rat-excludes (the Apache RAT allowlist, 145
      entries) should resolve to at least one on-disk file. A stale
      entry means a vendored/generated file was deleted or renamed but
      the exclude was left behind — the next RAT run silently widens
      its allowlist. (v0.10 registry_paths_resolve; prior config could
      only check presence + min-lines.)

  - id: spark-rat-excludes-present
    kind: file_exists
    paths: dev/.rat-excludes
    level: error
    message: >-
      dev/.rat-excludes is the Apache RAT path-pattern allowlist.

  # ═══════════════════════════════════════════════════════════════════
  # 4. Scala import firewall — the v0.11 import_gate WIN.
  #    scalastyle-config.xml carries IllegalImportsChecker rules that
  #    forbid specific imports across the Scala tree. These are import
  #    BOUNDARY rules, not style — exactly import_gate's domain. Lifting
  #    them out of scalastyle means they run in 1.x s as part of the
  #    alint pass (no JVM/scalastyle startup) and fire at PR time.
  #    NOTE: the scalastyle AST checks (ImportOrderChecker etc.) stay in
  #    scalastyle; only the illegal-IMPORT-target gates move here.
  # ═══════════════════════════════════════════════════════════════════
  - id: spark-scala-no-log4j-direct
    kind: import_gate
    paths: "**/*.scala"
    language: generic
    import_pattern: '^\s*import\s+(\S+)'
    forbid: '^org\.apache\.log4j'
    level: error
    message: >-
      Direct org.apache.log4j imports are forbidden — use Spark's
      logging facade. Lifted from scalastyle IllegalImportsChecker
      (illegalImports=org.apache.log4j) into a v0.11 import_gate so it
      fires at PR time without a scalastyle/JVM run.

  - id: spark-scala-no-commons-codec-digest
    kind: import_gate
    paths: "**/*.scala"
    language: generic
    import_pattern: '^\s*import\s+(\S+)'
    forbid: '^org\.apache\.commons\.codec\.digest'
    level: error
    message: >-
      org.apache.commons.codec.digest imports are forbidden (scalastyle
      IllegalImportsChecker) — use the project's hashing utilities.

  # ═══════════════════════════════════════════════════════════════════
  # 5. Codegen + lockfile freshness — v0.11 command_idempotent WINS.
  #    The prior config wrapped these as plain command: shellouts. The
  #    command_idempotent kind models them precisely: run a checker in
  #    its check/diff mode; exit 0 = clean (silent), non-zero = a
  #    freshness violation. alint never mutates the tree.
  # ═══════════════════════════════════════════════════════════════════

  # Spark Connect proto codegen freshness. check-protos.py regenerates
  # protos under a tmpdir and byte-compares to committed outputs.
  - id: spark-protos-fresh
    kind: command_idempotent
    command: ["python3", "dev/check-protos.py"]
    workdir: "."
    timeout: 300
    level: warning
    message: >-
      Spark Connect generated protos are stale — run the proto codegen
      and commit. (dev/check-protos.py, modelled as a command_idempotent
      freshness checker; was a plain command: shellout before v0.11.)

  # Maven dependency-manifest lockfile freshness. test-dependencies.sh
  # regenerates dev/deps/spark-deps-* and git-diffs vs committed (exits
  # non-zero on drift) — a textbook command_idempotent checker.
  - id: spark-deps-manifest-fresh
    kind: command_idempotent
    command: ["dev/test-dependencies.sh"]
    workdir: "."
    timeout: 1200
    level: warning
    message: >-
      The committed Maven dependency manifest (dev/deps/spark-deps-*)
      is out of sync with the resolved dependency tree — run
      ./dev/test-dependencies.sh --replace-manifest and commit. The
      Maven equivalent of a Cargo.lock freshness check.

  - id: spark-deps-manifest-present
    kind: file_exists
    paths: dev/deps/spark-deps-hadoop-3-hive-2.3
    level: error
    message: >-
      dev/deps/spark-deps-hadoop-3-hive-2.3 is the pinned Maven
      dependency manifest; CI fails if the regenerated diff is non-empty.

  # ═══════════════════════════════════════════════════════════════════
  # 6. PR hygiene — v0.11 git_commit_no_fixup.
  #    Spark does NOT use DCO/Signed-off-by (it gates on JIRA + the
  #    dev/merge_spark_pr.py squash-merge), so git_commit_signed_off is
  #    intentionally NOT used. But residual fixup!/squash! commits in a
  #    PR are a universal nuisance the squash-merge script papers over;
  #    flagging them at PR time keeps the history reviewable.
  # ═══════════════════════════════════════════════════════════════════
  - id: spark-no-fixup-commits
    kind: git_commit_no_fixup
    since: "{{env.ALINT_BASE_SHA | default('origin/master')}}"
    level: warning
    message: >-
      Residual fixup!/squash!/amend! commits found in this PR range —
      rebase --autosquash before review. (Spark squash-merges via
      dev/merge_spark_pr.py, but unsquashed fixups still clutter review.)

  # ═══════════════════════════════════════════════════════════════════
  # 7. Per-language MODULE conventions (Python + R). Unchanged from the
  #    prior config — for_each_dir + file_content_matches is still the
  #    right shape for package-name/license assertions in setup.py and
  #    DESCRIPTION (those are not XML/structured manifests).
  # ═══════════════════════════════════════════════════════════════════
  - id: spark-python-packaging-variant-shape
    kind: for_each_dir
    select: "python/packaging/{classic,client,connect}"
    require:
      - kind: file_exists
        paths: "{path}/setup.py"
      - kind: file_exists
        paths: "{path}/setup.cfg"
    level: error
    message: >-
      Every PySpark packaging variant must ship setup.py + setup.cfg
      (→ the pyspark / pyspark-client / pyspark-connect PyPI dists).

  - id: spark-python-classic-name-pyspark
    kind: file_content_matches
    paths: python/packaging/classic/setup.py
    pattern: '(?m)^\s*name="pyspark",\s*$'
    level: error
    message: >-
      python/packaging/classic/setup.py MUST declare name="pyspark".

  - id: spark-python-connect-name
    kind: file_content_matches
    paths: python/packaging/connect/setup.py
    pattern: '(?m)^\s*name="pyspark-connect",\s*$'
    level: error
    message: >-
      python/packaging/connect/setup.py MUST declare name="pyspark-connect".

  - id: spark-python-client-name
    kind: file_content_matches
    paths: python/packaging/client/setup.py
    pattern: '(?m)^\s*name="pyspark-client",\s*$'
    level: error
    message: >-
      python/packaging/client/setup.py MUST declare name="pyspark-client".

  - id: spark-python-pyproject-present
    kind: file_exists
    paths: pyproject.toml
    root_only: true
    level: error
    message: >-
      Root pyproject.toml configures [tool.ruff] + [tool.black] for PySpark.

  - id: spark-python-pyproject-ruff-line-length
    kind: toml_path_matches
    paths: pyproject.toml
    path: "$.tool.ruff['line-length']"
    matches: '^100$'
    level: warning
    message: >-
      pyproject.toml [tool.ruff] line-length should be 100.

  - id: spark-python-mypy-config-present
    kind: file_exists
    paths: python/mypy.ini
    level: warning
    message: "python/mypy.ini is the PySpark type-check config."

  - id: spark-python-manifest-in-present
    kind: file_exists
    paths: python/MANIFEST.in
    level: error
    message: "python/MANIFEST.in drives the sdist file inclusion list."

  - id: spark-r-description-present
    kind: file_exists
    paths: R/pkg/DESCRIPTION
    level: error
    message: "R/pkg/DESCRIPTION is the CRAN-required SparkR manifest."

  - id: spark-r-description-package-name
    kind: file_content_matches
    paths: R/pkg/DESCRIPTION
    pattern: '(?m)^Package:\s*SparkR$'
    level: error
    message: "R/pkg/DESCRIPTION Package: MUST be SparkR."

  - id: spark-r-description-license
    kind: file_content_matches
    paths: R/pkg/DESCRIPTION
    pattern: '(?m)^License:\s*Apache License'
    level: error
    message: "R/pkg/DESCRIPTION License: MUST declare the Apache License."

  - id: spark-r-namespace-present
    kind: file_exists
    paths: R/pkg/NAMESPACE
    level: error
    message: "R/pkg/NAMESPACE is the CRAN-required exports manifest."

  # ═══════════════════════════════════════════════════════════════════
  # 8. Two-tier LICENSE/NOTICE discipline. apache/governance@v1 (above)
  #    covers LICENSE/NOTICE/source-header; the BINARY-distribution
  #    counterparts are spark-specific (an Apache TLP that ships a
  #    binary tarball), so they stay hand-rolled.
  # ═══════════════════════════════════════════════════════════════════
  - id: spark-license-binary-present
    kind: file_exists
    paths: LICENSE-binary
    root_only: true
    level: error
    message: >-
      LICENSE-binary lists every transitively-bundled third-party
      library in the binary tarball; the Apache release vote rejects a
      release without it.
    policy_url: "https://infra.apache.org/licensing-howto.html"

  - id: spark-notice-binary-present
    kind: file_exists
    paths: NOTICE-binary
    root_only: true
    level: error
    message: "NOTICE-binary is the binary-distribution NOTICE counterpart."

  - id: spark-licenses-binary-dir-present
    kind: dir_exists
    paths: licenses-binary
    level: error
    message: >-
      licenses-binary/ holds the per-library license files referenced
      by LICENSE-binary.

  - id: spark-licenses-dir-present
    kind: dir_exists
    paths: licenses
    level: warning
    message: >-
      licenses/ holds the per-library files for in-tree vendored code.

  # ═══════════════════════════════════════════════════════════════════
  # 9. .asf.yaml ASF infra config — structured yaml-path checks.
  # ═══════════════════════════════════════════════════════════════════
  - id: spark-asf-yaml-present
    kind: file_exists
    paths: .asf.yaml
    level: error
    message: ".asf.yaml is the canonical ASF infra config."

  - id: spark-asf-declares-homepage
    kind: yaml_path_matches
    paths: .asf.yaml
    path: "$.github.homepage"
    matches: '^https://spark\.apache\.org/?$'
    level: warning
    message: ".asf.yaml github.homepage should be https://spark.apache.org/."

  # ═══════════════════════════════════════════════════════════════════
  # 10. Per-language tool-config presence (the lint-* scripts assume
  #     these exist at canonical locations).
  # ═══════════════════════════════════════════════════════════════════
  - id: spark-scalastyle-config-present
    kind: file_exists
    paths: scalastyle-config.xml
    root_only: true
    level: error
    message: "scalastyle-config.xml is required at root for dev/scalastyle."

  - id: spark-scalafmt-config-present
    kind: file_exists
    paths: dev/.scalafmt.conf
    level: error
    message: "dev/.scalafmt.conf pins scalafmt for the sql/connect modules."

  - id: spark-checkstyle-config-present
    kind: file_exists
    paths: dev/checkstyle.xml
    level: error
    message: "dev/checkstyle.xml pins the Java checkstyle rules."

  - id: spark-checkstyle-suppressions-present
    kind: file_exists
    paths: dev/checkstyle-suppressions.xml
    level: warning
    message: "dev/checkstyle-suppressions.xml is required by dev/lint-java."

  - id: spark-eslint-config-present
    kind: file_exists
    paths: dev/eslint.js
    level: warning
    message: "dev/eslint.js pins the JS style rules for in-tree UI assets."

  - id: spark-tox-ini-present
    kind: file_exists
    paths: dev/tox.ini
    level: warning
    message: "dev/tox.ini configures flake8."

  - id: spark-gitattributes-present
    kind: file_exists
    paths: .gitattributes
    root_only: true
    level: warning
    message: >-
      .gitattributes pins per-extension EOL policy (LF for source,
      CRLF for *.bat/*.cmd).

  # ═══════════════════════════════════════════════════════════════════
  # 11. Hygiene — spark-specific tracked-artefact patterns.
  # ═══════════════════════════════════════════════════════════════════
  - id: spark-no-tracked-derby-log
    kind: file_absent
    paths: "**/derby.log"
    git_tracked_only: true
    level: warning
    message: "derby.log is a runtime artefact; never track it."

  - id: spark-no-tracked-pyspark-coverage
    kind: dir_absent
    paths: "**/pyspark-coverage-site"
    git_tracked_only: true
    level: warning
    message: "pyspark-coverage-site/ is a generated coverage report."

  # ═══════════════════════════════════════════════════════════════════
  # 12. Per-language lint-script shellouts — the orchestration layer.
  #     The Scala/Java/Python/R/JS AST + style passes stay in their
  #     upstream tools; alint wraps them via command: so one `alint
  #     check` drives the whole pipeline. Each gated on the config file
  #     the script reads (rule no-ops if config is deleted).
  #     Note: lint-python --ruff also lives as a pre-commit hook, but is
  #     restated here so a single alint pass is the orchestrator.
  # ═══════════════════════════════════════════════════════════════════
  - id: spark-lint-scala-run
    kind: command
    paths: scalastyle-config.xml
    command: ["dev/lint-scala"]
    timeout: 600
    level: error

  - id: spark-lint-java-run
    kind: command
    paths: dev/checkstyle.xml
    command: ["dev/lint-java"]
    timeout: 600
    level: error

  - id: spark-lint-python-run
    kind: command
    paths: pyproject.toml
    command: ["dev/lint-python", "--ruff"]
    timeout: 300
    level: error

  - id: spark-lint-r-run
    kind: command
    paths: R/pkg/DESCRIPTION
    command: ["dev/lint-r"]
    timeout: 300
    level: warning

  - id: spark-lint-js-run
    kind: command
    paths: dev/eslint.js
    command: ["dev/lint-js"]
    timeout: 300
    level: warning

  - id: spark-check-license-run
    kind: command
    paths: dev/.rat-excludes
    command: ["dev/check-license"]
    timeout: 300
    level: error
