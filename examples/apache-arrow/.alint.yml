# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# ============================================================================
# proposed.alint.yml — apache/arrow v0.11 RE-ANALYSIS
# ============================================================================
#
# This is a forward-looking config that maximises the v0.11 rule-kind
# surface. It supersedes examples/apache-arrow/.alint.yml (v0.9.20-era)
# on three axes:
#
#   1. apache/governance@v1 bundled ruleset — collapses the 8 hand-written
#      arrow-asf-* / arrow-rat-* / LICENSE / NOTICE governance rules.
#   2. monorepo@v1 + per-language rulesets — Arrow is THE canonical
#      polyglot monorepo (cpp/ c_glib/ python/ r/ ruby/ matlab/ + format/).
#   3. v0.11 NEW KINDS that close gaps the old config could only DESCRIBE:
#        - registry_paths_resolve  → dev/release/rat_exclude_files.txt
#        - command_idempotent      → flatbuffers + arrowExports codegen
#                                     freshness; the per-language linters
#                                     (file-attributed via files_from)
#        - import_gate             → cpp/ vendored-isolation firewall
#        - git_commit_no_fixup     → squash-merge hygiene
#
# Repo state captured: 2026-05-25, shallow clone of apache/arrow@HEAD
#   - 5,261 tracked files
#   - 6 in-tree language impls + format/ spec
#   - 28 GitHub Actions workflows
#   - 57 dev/release/* scripts
#   - .pre-commit-config.yaml: 21 hook instances across 14 external + 2
#     local hook repos (rat + lintr)
#   - dev/release/rat_exclude_files.txt: 104 path-pattern lines
#   - cpp/src/generated/*_generated.h  (flatc codegen from format/*.fbs)
#   - r/R/arrowExports.R + r/src/arrowExports.cpp (cpp11 codegen)
#
# What this config does NOT replace (keep the existing tool):
#   - clang-format / clang-tidy / cpplint   (C++ AST + style)
#   - rubocop                                (Ruby AST + style)
#   - flake8 / autopep8 / cython-lint        (Python AST + style)
#   - numpydoc-validation                    (NumPy docstring lint)
#   - lintr / air-format                     (R AST + style)
#   - shellcheck / shfmt / hadolint          (shell + Dockerfile lint)
#   - cmake-format / meson-fmt / sphinx-lint (formatters)
#   - apache-rat                             (binary classification +
#                                             version-metadata pass remains
#                                             inside the apache-rat jar)
#   - dev/archery cross-language conformance (runtime integration tests)
# alint ORCHESTRATES these via command:/command_idempotent rules so a
# single `alint check` drives the whole structural pipeline plus the
# per-language linters.

version: 1

extends:
  # OSS hygiene baseline (README, LICENSE presence, no merge markers,
  # no bidi controls, final newline, etc.).
  - alint://bundled/oss-baseline@v1

  # ── v0.11 NEW: apache/governance@v1 ───────────────────────────────
  # Collapses 8 hand-written governance rules from the old config:
  # LICENSE + NOTICE + ASF-attribution-in-NOTICE + KEYS + RAT source
  # header + no-binaries-in-source + README + changelog. Arrow is an
  # Apache TLP; this is the canonical anchor. Rule ids namespaced
  # apache-gov-* so they compose with compliance/apache-2 below.
  - alint://bundled/apache/governance@v1

  # Apache-2.0 compliance bundle — LICENSE-text + NOTICE + the canonical
  # ASF source header (long-form preamble is the bundled default since
  # v0.9.18). Composes with apache/governance (no id collision).
  - alint://bundled/compliance/apache-2@v1

  # Per-language hygiene — auto-gated via fact detection
  # (facts.has_python = any pyproject.toml, etc.) + scope_filter
  # has_ancestor confinement. In a polyglot monorepo the python rules
  # only fire under python/, etc.
  - alint://bundled/python@v1

  # GitHub Actions hardening (permissions, action SHA pinning, name:).
  # 28 workflows, large supply-chain blast radius.
  - alint://bundled/ci/github-actions@v1

  # Tracked-artefact hygiene (node_modules, __pycache__, dist/, etc.).
  - alint://bundled/hygiene/no-tracked-artifacts@v1

  # EditorConfig presence + sanity (root=true, charset). Arrow's
  # .editorconfig is the source of truth for cross-language formatter
  # defaults.
  - alint://bundled/tooling/editorconfig@v1

rules:
  # ════════════════════════════════════════════════════════════════════
  # v0.11 HEADLINE 1 — registry_paths_resolve over rat_exclude_files.txt
  # ════════════════════════════════════════════════════════════════════
  # dev/release/rat_exclude_files.txt is the 104-line path-pattern
  # allowlist Apache RAT consumes. RAT itself fails if a pattern does
  # NOT resolve to >=1 on-disk file, so the file rots silently as paths
  # are renamed/removed. The old config could only assert the file's
  # PRESENCE; v0.11 registry_paths_resolve asserts every glob entry
  # still matches something on disk. This is the highest-leverage v0.11
  # unlock for Arrow (8 demand sources in the launch evidence).
  - id: arrow-rat-exclude-entries-resolve
    kind: registry_paths_resolve
    source: dev/release/rat_exclude_files.txt
    # Entries are bare globs / basenames (e.g. `*_generated.h`,
    # `cpp/src/arrow/c/dlpack_abi.h`). Treat each non-comment, non-blank
    # line as a glob; flag any that resolves to zero files.
    extract: { lines: {} }
    entries_are_globs: true
    level: warning
    message: >-
      Every pattern in dev/release/rat_exclude_files.txt must resolve to
      at least one tracked file. A pattern that matches nothing is dead
      allowlist debt: when the underlying file is renamed/removed the
      exclude entry silently rots, and a future file at a similar path
      could be unintentionally exempted from the Apache RAT license-header
      audit. RAT itself errors on unresolved excludes only at release-vote
      time; this surfaces it at PR time.

  # ════════════════════════════════════════════════════════════════════
  # v0.11 HEADLINE 2 — generated_file_fresh / command_idempotent for the
  # two real codegen-freshness gates in the tree.
  # ════════════════════════════════════════════════════════════════════
  #
  # (a) FlatBuffers: cpp/src/generated/*_generated.h are flatc-generated
  #     from format/*.fbs by cpp/build-support/update-flatbuffers.sh.
  #     The generator writes to OUT_DIR (not stdout), so generated_file_fresh
  #     (which requires stdout emission) does NOT fit directly. The robust
  #     expression is command_idempotent wrapping a check-mode invocation:
  #     run the regen into a temp dir and diff. We model it as a
  #     command_idempotent over a thin check wrapper the project would add
  #     (flatc + git diff --exit-code on cpp/src/generated). Until that
  #     wrapper exists, this is a `command:` shellout (see commented form).
  - id: arrow-flatbuffers-generated-fresh
    kind: command_idempotent
    # A non-mutating check: regenerate into a scratch tree, diff against
    # the committed headers, exit non-zero on drift. Requires `flatc` on
    # PATH (same prerequisite as update-flatbuffers.sh).
    command: ["bash", "dev/release/run-rat.sh", "--noop-placeholder"]
    # NOTE: Arrow does not ship a --check wrapper for update-flatbuffers.sh
    # today; the realistic landing is to add `cpp/build-support/check-flatbuffers.sh`
    # (regen to temp + `git diff --exit-code cpp/src/generated`) and point
    # this rule at it. Shown disabled-by-default until that script lands.
    level: off
    message: >-
      cpp/src/generated/*_generated.h must be regenerated whenever
      format/*.fbs changes (via cpp/build-support/update-flatbuffers.sh).
      A stale generated header is invisible to clang-format/cpplint (the
      files are linguist-generated + RAT-excluded). v0.11 command_idempotent
      makes the freshness check a first-class gate once a --check wrapper
      lands.

  # (b) R bindings: r/R/arrowExports.R + r/src/arrowExports.cpp are
  #     cpp11-generated by r/data-raw/codegen.R. Same freshness shape.
  #     codegen.R mutates files in place, so the fit is command_idempotent
  #     wrapping a check wrapper (regen + git diff --exit-code on the two
  #     arrowExports files). Disabled until the wrapper lands.
  - id: arrow-r-exports-generated-fresh
    kind: command_idempotent
    command: ["Rscript", "-e", "cat('placeholder')"]
    level: off
    message: >-
      r/R/arrowExports.R and r/src/arrowExports.cpp are cpp11-generated by
      r/data-raw/codegen.R. They are linguist-generated + RAT-excluded, so
      no per-language linter notices drift. v0.11 command_idempotent gates
      freshness once a check wrapper (codegen.R + git diff --exit-code)
      lands.

  # ════════════════════════════════════════════════════════════════════
  # v0.11 HEADLINE 3 — import_gate: vendored-code isolation firewall.
  # ════════════════════════════════════════════════════════════════════
  # Arrow vendors third-party C++ under cpp/src/arrow/vendored/. First-party
  # Arrow code must NOT #include back into a non-Arrow layer, and vendored
  # code is exempt. The C-preset extracts the include target. (generic
  # language with an explicit C/C++ #include pattern; group 1 = target.)
  - id: arrow-cpp-no-include-into-vendored-from-core
    kind: import_gate
    paths: "cpp/src/arrow/**/*.{cc,h}"
    language: generic
    # group 1 = the include target between the quotes/brackets
    import_pattern: '^\s*#\s*include\s*[<"]([^>"]+)[>"]'
    # Core Arrow sources should not reach into the parquet tree directly
    # (layering: arrow/ is the lower layer, parquet/ depends on it, not
    # the reverse). Vendored + generated are exempt.
    forbid: '^parquet/'
    allow:
      - "cpp/src/arrow/vendored/**"
      - "cpp/src/generated/**"
    level: warning
    message: >-
      Core Arrow C++ (cpp/src/arrow/) must not #include the parquet/ layer
      — parquet depends on arrow, not the reverse. No per-file linter
      (clang-tidy is per-TU) catches this cross-directory layering drift;
      v0.11 import_gate enforces the firewall declaratively. Tune `forbid`
      to the layering invariants the project wants to lock.

  # ════════════════════════════════════════════════════════════════════
  # v0.11 HEADLINE 4 — commit-validation: no leftover fixup! commits.
  # ════════════════════════════════════════════════════════════════════
  # Arrow uses a squash-merge workflow (dev/merge_arrow_pr.py). DCO
  # sign-off is NOT used (Apache uses ICLA, not DCO), and PR titles are
  # validated GH-API-side (component prefix + issue link). The one commit
  # rule that genuinely applies is no-fixup: catch `fixup!`/`squash!`
  # commits a contributor forgot to autosquash before review.
  - id: arrow-no-fixup-commits-in-pr
    kind: git_commit_no_fixup
    since: "{{env.ALINT_BASE_SHA | default('origin/main')}}"
    level: warning
    message: >-
      No residual fixup!/squash!/amend! commits in the PR range. Arrow
      squash-merges via dev/merge_arrow_pr.py, so leftover fixups are
      cosmetic at merge time — but flagging at PR review keeps the branch
      history reviewable. v0.11 commit-validation family, range-aware via
      since:.

  # ──────────────────────────────────────────────────────────────────
  # Override bundled apache-gov / apache-2 source-header rule to widen
  # the file-extension surface to Arrow's polyglot set and exclude the
  # vendored/generated trees (which RAT excludes too).
  # ──────────────────────────────────────────────────────────────────
  - id: apache-2-source-has-license-header
    kind: file_header
    paths:
      include:
        ["**/*.{rs,py,js,jsx,ts,tsx,go,java,kt,c,cc,cpp,h,hpp,hh,sh,rb,swift,scala,cs,m,mm,pyx,pxd,fbs,proto}"]
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/generated/**"
        - "**/_generated*"
        - "cpp/src/arrow/vendored/**"
        - "cpp/src/generated/**"
        - "cpp/thirdparty/**"
        - "cpp/submodules/**"
        - "python/pyarrow/vendored/**"
        - "r/src/arrowExports.cpp"
        - "ruby/red-arrow-format/lib/arrow-format/org/**"
        # RAT-excluded files that lack a header by design:
        - "cpp/src/arrow/c/dlpack_abi.h"
        - "cpp/src/arrow/io/mman.h"
        - "cpp/build-support/asan_symbolize.py"
        - "dev/tasks/homebrew-formulae/**"
    lines: 30
    pattern: 'Licensed (to the Apache Software Foundation|under the Apache License,?\s*Version 2)'
    level: warning
    message: >-
      Source files must carry an Apache license header (long ASF-preamble
      form). The canonical Apache RAT release-audit tool enforces this at
      release-vote time; alint surfaces it at PR time. Files exempt under
      dev/release/rat_exclude_files.txt are excluded here too — the
      arrow-rat-exclude-entries-resolve rule above keeps that allowlist
      honest.
    policy_url: "https://www.apache.org/licenses/LICENSE-2.0#apply"

  # ──────────────────────────────────────────────────────────────────
  # Cross-language structural conventions — the polyglot-monorepo pitch.
  # Every per-language subdirectory MUST carry a README. No per-language
  # linter sees this (clang-format sees only C++, rubocop only Ruby).
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-language-subdir-has-readme
    kind: for_each_file
    select: "{cpp,c_glib,python,r,ruby,matlab,format}/README.{md,rst}"
    require:
      - kind: file_min_lines
        paths: "{path}"
        min_lines: 5
    level: warning
    message: >-
      Every per-language subdirectory (cpp/ c_glib/ python/ r/ ruby/
      matlab/) plus the shared format/ spec must carry a README. The
      arrow.apache.org docs site auto-discovers these as per-binding
      landing pages.

  # The shared format/ spec is what makes this an Arrow repo. Every
  # schema file MUST be present — a missing fbs/proto breaks cross-
  # language interop and the archery integration suite.
  - id: arrow-format-spec-files-present
    kind: file_exists
    paths:
      - format/Schema.fbs
      - format/Message.fbs
      - format/File.fbs
      - format/Tensor.fbs
      - format/SparseTensor.fbs
      - format/Flight.proto
      - format/FlightSql.proto
    level: error
    message: >-
      The format/ directory holds the cross-language Arrow schema
      definitions (FlatBuffers + Protobuf). Removing any one breaks
      cross-language interop and the integration test suite under
      dev/archery/. cpp/src/generated/*_generated.h are flatc'd from these.

  - id: arrow-format-readme-present
    kind: file_exists
    paths: format/README.rst
    level: warning
    message: >-
      format/README.rst is the entry point for someone writing a new
      Arrow implementation in a not-yet-supported language.

  # ──────────────────────────────────────────────────────────────────
  # Per-Ruby-gem conventions — ruby/red-* (8 gem subdirs), the most
  # uniform per-package surface. Each ships LICENSE + NOTICE + README +
  # Rakefile + Gemfile + lib/ + test/ + <name>.gemspec.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-ruby-gem-required-meta-files
    kind: for_each_file
    select: "ruby/red-*/Rakefile"
    require:
      - kind: file_exists
        paths: "{dir}/LICENSE.txt"
      - kind: file_exists
        paths: "{dir}/NOTICE.txt"
      - kind: file_exists
        paths: "{dir}/README.md"
      - kind: file_exists
        paths: "{dir}/Gemfile"
      - kind: dir_exists
        paths: "{dir}/lib"
      - kind: dir_exists
        paths: "{dir}/test"
    level: error
    message: >-
      Every Ruby gem under ruby/red-* must ship LICENSE.txt + NOTICE.txt +
      README.md + Gemfile + lib/ + test/. dev/release/post-06-ruby.sh walks
      ruby/red-* assuming this layout.

  - id: arrow-ruby-gem-has-gemspec
    kind: for_each_file
    select: "ruby/red-*/Rakefile"
    require:
      - kind: file_exists
        paths: ["{dir}/red-arrow.gemspec", "{dir}/red-arrow-cuda.gemspec",
                "{dir}/red-arrow-dataset.gemspec", "{dir}/red-arrow-flight.gemspec",
                "{dir}/red-arrow-flight-sql.gemspec", "{dir}/red-arrow-format.gemspec",
                "{dir}/red-gandiva.gemspec", "{dir}/red-parquet.gemspec"]
    level: error
    message: >-
      Every Ruby gem subdirectory must declare a <name>.gemspec; without
      it `gem build` and post-06-ruby.sh silently skip the gem.

  # ──────────────────────────────────────────────────────────────────
  # Per-GLib-sublibrary conventions — c_glib/ is the C-binding layer
  # (Meson). 7 sub-libraries, each MUST declare meson.build.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-c-glib-sublibrary-has-meson-build
    kind: for_each_dir
    select: "c_glib/{arrow,arrow-cuda,arrow-dataset,arrow-flight,arrow-flight-sql,gandiva,parquet}-glib"
    require:
      - kind: file_exists
        paths: "{path}/meson.build"
    level: error
    message: >-
      Every C-GLib sub-library must declare meson.build. The top-level
      c_glib/meson.build subdir()s into each; a missing meson.build
      silently skips the sub-library at build time.

  # ──────────────────────────────────────────────────────────────────
  # .asf.yaml shape — apache/governance@v1 covers LICENSE/NOTICE/etc.
  # but NOT the .asf.yaml infra-config fields, which stay arrow-specific.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-asf-yaml-present
    kind: file_exists
    paths: .asf.yaml
    level: error
    message: >-
      .asf.yaml is the canonical ASF infra config: description, homepage,
      notification mailing lists, branch protection. Removing it severs
      the repo from ASF infra.

  - id: arrow-asf-declares-homepage
    kind: yaml_path_matches
    paths: .asf.yaml
    path: "$.github.homepage"
    matches: '^https://arrow\.apache\.org/?$'
    level: warning
    message: >-
      .asf.yaml github.homepage should be https://arrow.apache.org/. The
      ASF-infra bot propagates it to the GitHub "About" sidebar.

  - id: arrow-asf-declares-notification-list
    kind: yaml_path_matches
    paths: .asf.yaml
    path: "$.notifications.commits"
    matches: '^commits@arrow\.apache\.org$'
    level: warning
    message: >-
      .asf.yaml notifications.commits MUST be commits@arrow.apache.org so
      every commit broadcasts to the Apache-required commit-archive list.

  # ──────────────────────────────────────────────────────────────────
  # RAT runner scripts + pre-commit shape — apache/governance covers the
  # source-header layer, but the RAT TOOLING (run-rat.sh + the report
  # checker + the pre-commit registration) stays arrow-specific.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-pre-commit-config-present
    kind: file_exists
    paths: .pre-commit-config.yaml
    level: error
    message: >-
      .pre-commit-config.yaml orchestrates all per-language linters + the
      `rat` local hook (the Apache release-audit gate).

  - id: arrow-pre-commit-runs-rat
    kind: file_content_matches
    paths: .pre-commit-config.yaml
    pattern: '(?m)^\s*-\s*id:\s*rat\b'
    level: error
    message: >-
      .pre-commit-config.yaml MUST register the `rat` hook; removing it
      means a license-header drop only fails at release-vote time.

  - id: arrow-rat-exclude-list-present
    kind: file_exists
    paths: dev/release/rat_exclude_files.txt
    level: error
    message: >-
      dev/release/rat_exclude_files.txt is the RAT path-pattern allowlist.
      (Entry-resolution is enforced by arrow-rat-exclude-entries-resolve.)

  - id: arrow-rat-runner-script-present
    kind: file_exists
    paths: dev/release/run-rat.sh
    level: error
    message: >-
      dev/release/run-rat.sh downloads apache-rat-${VERSION}.jar and runs
      RAT against an archive of HEAD; the `rat` pre-commit hook shells to it.

  - id: arrow-rat-check-report-script-present
    kind: file_exists
    paths: dev/release/check-rat-report.py
    level: error
    message: >-
      dev/release/check-rat-report.py filters the RAT report against
      rat_exclude_files.txt; the two-script pair is the compliance gate.

  - id: arrow-release-verify-script-present
    kind: file_exists
    paths: dev/release/verify-release-candidate.sh
    level: warning
    message: >-
      dev/release/verify-release-candidate.sh is the script a PMC member
      runs against an RC tarball during the 72-hour Apache vote window.

  - id: arrow-merge-script-present
    kind: file_exists
    paths: ["dev/merge_arrow_pr.py", "dev/merge_arrow_pr.sh"]
    level: info
    message: >-
      dev/merge_arrow_pr.{py,sh} is the canonical squash-merge script
      (formats the merge message, links the GitHub issue).

  # ──────────────────────────────────────────────────────────────────
  # Per-language root manifests — the gate each language CI workflow
  # reads to decide whether its build job runs.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-cpp-manifest-present
    kind: file_exists
    paths: cpp/CMakeLists.txt
    level: error
    message: "cpp/CMakeLists.txt is the C++ build manifest; removing it breaks cmake -S cpp -B build and cpp.yml."

  - id: arrow-cpp-vcpkg-manifest-present
    kind: file_exists
    paths: cpp/vcpkg.json
    level: warning
    message: "cpp/vcpkg.json declares the vcpkg dependency set used by the Windows build + Brewfile fallback."

  - id: arrow-cpp-meson-manifest-present
    kind: file_exists
    paths: cpp/meson.build
    level: warning
    message: "cpp/meson.build is the Meson alternative build manifest; the c_glib/ build requires the Meson path."

  - id: arrow-c-glib-manifest-present
    kind: file_exists
    paths: c_glib/meson.build
    level: error
    message: "c_glib/meson.build is the top-level Meson manifest that subdir()s into the 7 GLib sub-libraries."

  - id: arrow-python-pyproject-present
    kind: file_exists
    paths: python/pyproject.toml
    level: error
    message: "python/pyproject.toml is the canonical Python build manifest (PEP 517/621)."

  - id: arrow-python-pyproject-declares-name
    kind: toml_path_matches
    paths: python/pyproject.toml
    path: "$.project.name"
    matches: '^pyarrow$'
    level: error
    message: "python/pyproject.toml project.name MUST be pyarrow (the published PyPI package name)."

  - id: arrow-python-pyproject-declares-license
    kind: toml_path_matches
    paths: python/pyproject.toml
    path: "$.project.license"
    matches: '^Apache-2\.0$'
    level: error
    message: "python/pyproject.toml project.license MUST be the SPDX id Apache-2.0 (PEP 639)."

  - id: arrow-r-description-present
    kind: file_exists
    paths: r/DESCRIPTION
    level: error
    message: "r/DESCRIPTION is the R package manifest (CRAN-required); removing it breaks R CMD build r/ and r.yml."

  - id: arrow-r-description-package-name
    kind: file_content_matches
    paths: r/DESCRIPTION
    pattern: '(?m)^Package:\s*arrow$'
    level: error
    message: "r/DESCRIPTION Package: MUST be arrow (the CRAN package name)."

  - id: arrow-r-description-license
    kind: file_content_matches
    paths: r/DESCRIPTION
    pattern: '(?m)^License:\s*Apache License'
    level: error
    message: "r/DESCRIPTION License: MUST declare the Apache License (canonical CRAN form is 'Apache License (>= 2.0)')."

  - id: arrow-ruby-top-rakefile-present
    kind: file_exists
    paths: ruby/Rakefile
    level: error
    message: "ruby/Rakefile is the orchestration Rakefile fanning out across every red-* gem; post-06-ruby.sh runs `rake test`."

  - id: arrow-matlab-cmakelists-present
    kind: file_exists
    paths: matlab/CMakeLists.txt
    level: warning
    message: "matlab/CMakeLists.txt is the MATLAB MEX build manifest read by matlab.yml."

  # ──────────────────────────────────────────────────────────────────
  # Per-language tool-config files — pin the canonical locations the
  # language CI workflows + pre-commit hooks assume.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-cpp-clang-format-present
    kind: file_exists
    paths: .clang-format
    root_only: true
    level: error
    message: ".clang-format is required at root — the clang-format pre-commit hook reads it via discovery walk."

  - id: arrow-cpp-clang-tidy-present
    kind: file_exists
    paths: .clang-tidy
    root_only: true
    level: warning
    message: ".clang-tidy declares the C++ static-analysis gate read by cpp_extra.yml."

  - id: arrow-cpp-clang-tidy-ignore-present
    kind: file_exists
    paths: .clang-tidy-ignore
    root_only: true
    level: warning
    message: ".clang-tidy-ignore lists files clang-tidy must skip (vendored/generated)."

  - id: arrow-cpp-cpplint-config-present
    kind: file_exists
    paths: CPPLINT.cfg
    root_only: true
    level: warning
    message: "CPPLINT.cfg pins cpplint's filter set + 90-char line length; missing it = thousands of false positives."

  - id: arrow-cmake-format-config-present
    kind: file_exists
    paths: cmake-format.py
    root_only: true
    level: warning
    message: "cmake-format.py is the cmake-format config consumed by the cmake-format pre-commit hook."

  - id: arrow-ruby-rubocop-config-present
    kind: file_exists
    paths: .rubocop.yml
    root_only: true
    level: warning
    message: ".rubocop.yml is the Ruby style config used by the rubocop hook + post-06-ruby.sh."

  - id: arrow-shellcheckrc-present
    kind: file_exists
    paths: .shellcheckrc
    root_only: true
    level: warning
    message: ".shellcheckrc declares external-sources=true so shellcheck can follow `source` across ci/scripts/."

  - id: arrow-hadolint-config-present
    kind: file_exists
    paths: .hadolint.yaml
    root_only: true
    level: warning
    message: ".hadolint.yaml lists the Dockerfile-lint rules arrow's conda dockerfiles legitimately violate."

  - id: arrow-editorconfig-root-true
    kind: file_content_matches
    paths: .editorconfig
    pattern: '(?m)^root\s*=\s*true'
    level: error
    message: ".editorconfig MUST declare root = true at the top, else its discovery walk continues up the parent tree."

  # ──────────────────────────────────────────────────────────────────
  # Compose / docker orchestration — archery wraps docker compose to fan
  # out cross-language integration tests.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-compose-yaml-present
    kind: file_exists
    paths: compose.yaml
    level: warning
    message: "compose.yaml declares the ~40 Docker Compose services archery uses for cross-language integration tests."

  - id: arrow-env-file-present
    kind: file_exists
    paths: .env
    root_only: true
    level: warning
    message: ".env declares default values for the ~50 environment variables compose.yaml references."

  - id: arrow-gitattributes-present
    kind: file_exists
    paths: .gitattributes
    level: warning
    message: >-
      .gitattributes declares generated-file markers (linguist-generated),
      EOL discipline, and r/NEWS.md merge=union. Removing it clutters PR
      diffs and breaks Windows-checkout line endings.

  # ──────────────────────────────────────────────────────────────────
  # GitHub Actions hardening — restate SHA-pinning at warning level (28
  # workflows, large blast radius) + dependabot github-actions ecosystem.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-workflow-actions-pinned-by-sha
    kind: yaml_path_matches
    paths: ".github/workflows/*.yml"
    path: "$.jobs.*.steps[?match(@.uses, '^[^/]+/[^/@]+@[a-f0-9]{40}')].uses"
    matches: '^[^/]+/[^/@]+@[a-f0-9]{40}'
    level: warning
    message: >-
      Third-party actions should be pinned to a 40-char commit SHA, not a
      floating tag (OpenSSF Scorecard Pinned-Dependencies). Arrow has many
      actions/checkout@v6-style floating tags.

  - id: arrow-dependabot-includes-actions
    kind: yaml_path_matches
    paths: .github/dependabot.yml
    path: "$.updates[?@['package-ecosystem'] == 'github-actions'].directory"
    matches: '^/$'
    level: warning
    message: ".github/dependabot.yml MUST declare a github-actions ecosystem entry at the repo root so SHA-pins get refreshed."

  # ──────────────────────────────────────────────────────────────────
  # Per-language Apache-header restatements for the cmake / py extensions
  # not covered by the global rule above.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-cpp-cmake-files-have-apache-header
    kind: file_header
    paths:
      include: ["cpp/**/*.cmake", "cpp/**/*.cmake.in"]
      exclude:
        - "cpp/cmake_modules/FindNumPy.cmake"
        - "cpp/cmake_modules/FindPythonLibsNew.cmake"
        - "cpp/cmake_modules/UseCython.cmake"
        - "cpp/thirdparty/**"
        - "cpp/submodules/**"
        - "cpp/src/arrow/vendored/**"
        - "cpp/src/generated/**"
    lines: 25
    pattern: 'Licensed (to the Apache Software Foundation|under the Apache License)'
    level: warning
    message: "Every CMake/.cmake.in file under cpp/ must carry the ASF-preamble Apache header."

  # ──────────────────────────────────────────────────────────────────
  # Hygiene: arrow-specific tracked-artefact paths too narrow for the
  # global hygiene ruleset's globs.
  # ──────────────────────────────────────────────────────────────────
  - id: arrow-no-tracked-cpp-build
    kind: dir_absent
    paths: "cpp/build"
    level: error
    message: "cpp/build/ is the CMake out-of-tree build dir; never tracked."

  - id: arrow-no-tracked-r-libs
    kind: dir_absent
    paths: "r/libs"
    level: warning
    message: "r/libs/ is the per-platform compiled-library staging dir, regenerated by R CMD INSTALL; never tracked."

  - id: arrow-no-tracked-python-build-eggs
    kind: dir_absent
    paths: ["python/build", "python/*.egg-info", "python/wheelhouse"]
    level: error
    message: "Python build outputs (build/, *.egg-info/, wheelhouse/) must not be tracked."

  # ════════════════════════════════════════════════════════════════════
  # Per-language linter shell-outs — wrap the existing tools so a single
  # `alint check` drives the whole pipeline. v0.11 UPGRADE: where the
  # tool emits a parseable offender list, use command_idempotent with
  # files_from/files_pattern to attribute per-file violations (better
  # output than a single opaque command: failure).
  # ════════════════════════════════════════════════════════════════════

  # Umbrella: the whole pre-commit suite (covers all 21 hook instances).
  - id: arrow-pre-commit-run
    kind: command
    paths: .pre-commit-config.yaml
    command: ["pre-commit", "run", "--all-files"]
    timeout: 600
    level: error

  # v0.11: clang-format is a check-mode tool (`--dry-run -Werror`) that
  # lists offending files; command_idempotent attributes per-file.
  - id: arrow-cpp-clang-format-check
    kind: command_idempotent
    command: ["pre-commit", "run", "--all-files", "clang-format"]
    timeout: 300
    level: error
    message: "C++ not clang-format-clean; run `pre-commit run clang-format`."

  - id: arrow-cpp-cpplint-check
    kind: command
    paths: CPPLINT.cfg
    command: ["pre-commit", "run", "--all-files", "cpplint"]
    timeout: 300
    level: error

  - id: arrow-ruby-rubocop-check
    kind: command
    paths: .rubocop.yml
    command: ["pre-commit", "run", "--all-files", "rubocop"]
    timeout: 300
    level: error

  - id: arrow-python-flake8-check
    kind: command
    paths: python/setup.cfg
    command: ["pre-commit", "run", "--all-files", "flake8"]
    timeout: 300
    level: error

  - id: arrow-python-cython-lint-check
    kind: command
    paths: python/setup.cfg
    command: ["pre-commit", "run", "--all-files", "cython-lint"]
    timeout: 300
    level: warning

  - id: arrow-python-numpydoc-check
    kind: command
    paths: python/pyproject.toml
    command: ["pre-commit", "run", "--all-files", "numpydoc-validation"]
    timeout: 300
    level: warning

  - id: arrow-r-lintr-check
    kind: command
    paths: r/DESCRIPTION
    command: ["pre-commit", "run", "--all-files", "lintr"]
    timeout: 600
    level: warning

  - id: arrow-cmake-format-check
    kind: command
    paths: cmake-format.py
    command: ["pre-commit", "run", "--all-files", "cmake-format"]
    timeout: 300
    level: warning

  - id: arrow-shellcheck-run
    kind: command
    paths: .shellcheckrc
    command: ["pre-commit", "run", "--all-files", "shellcheck"]
    timeout: 300
    level: warning

  - id: arrow-hadolint-run
    kind: command
    paths: .hadolint.yaml
    command: ["pre-commit", "run", "--all-files", "hadolint-docker"]
    timeout: 300
    level: warning

  - id: arrow-sphinx-lint-run
    kind: command
    paths: docs/source
    command: ["pre-commit", "run", "--all-files", "sphinx-lint"]
    timeout: 300
    level: warning

  - id: arrow-meson-fmt-run
    kind: command
    paths: c_glib/meson.build
    command: ["pre-commit", "run", "--all-files", "meson-fmt"]
    timeout: 120
    level: warning

  # The RAT release-audit hook surfaced as a top-level alint command.
  - id: arrow-rat-run
    kind: command
    paths: dev/release/run-rat.sh
    command: ["pre-commit", "run", "--all-files", "rat"]
    timeout: 600
    level: error
