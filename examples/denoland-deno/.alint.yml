# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for denoland/deno  (re-analysis against alint v0.10/v0.11).
#
# Supersedes examples/denoland-deno/.alint.yml (written v0.9.17-era). That config
# could only express ~17 of deno's 30 structural surfaces declaratively and shelled
# the rest out via the legacy per-file `command` kind. The v0.10/v0.11 rule kinds
# (import_gate, command_idempotent, generated_file_fresh, ordered_block,
# cross_file_value_equals, git_commit_*) close most of that gap and FOLD the
# remaining shellouts into single-invocation, per-file-attributed rules.
#
# Captured against the live tip of main (2026-05): tools/lint.js (~9 checks),
# tools/copyright_checker.js, tools/format.js, tools/jsdoc_checker.js,
# tools/verify_pr_title.js, the 11 .github/workflows/*.ts generators (now
# self-linting via `--lint`), the per-crate clippy.toml method bans, and the
# per-language config files.
#
# KEY DELTAS vs the v0.9.17 config:
#   * top-level allowlist now includes DIRECTORY entries (.cargo .claude
#     .devcontainer .github cli ext libs runtime tests tools) — the curated set
#     in lint.js grew. dir_only_contains still only checks file children, so the
#     dir half stays a documented residual gap.
#   * workflow generators moved from "regenerate + diff" to a built-in `--lint`
#     self-check — that is a clean command_idempotent target, no longer a `pair`.
#   * clippy.toml entries are now `{ path = "...", reason = "..." }` objects (was
#     bare strings); the quoted-path content checks still match.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/rust@v1
  - alint://bundled/node@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/monorepo/cargo-workspace@v1
  - alint://bundled/tooling/editorconfig@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/agent-context@v1

vars:
  copyright_year: "2026"

facts:
  - id: has_dlint_config
    any_file_exists: [.dlint.json]

rules:
  # ═══════════════════════════════════════════════════════════════════
  # 1. tools/copyright_checker.js  — MIT header on every source file.
  #    Per-language because the comment leader differs (// vs #). The
  #    script tolerates a shebang, `// deno-lint-...`, `// Ported ...`,
  #    `// Copyright ...`, and blank lines BEFORE the canonical line; we
  #    emulate that with optional leading groups. Exclude set mirrors
  #    getSources()'s `:!:` negations verbatim.
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-copyright-rust
    kind: file_header
    paths:
      include: ["**/*.rs"]
      exclude: ["ops/optimizer_tests/**"]
    scope_filter:
      has_ancestor: Cargo.toml
    pattern: '^// Copyright 2018-2026 the Deno authors\. MIT license\.'
    level: error
    message: >-
      Every Rust source file must start with
      `// Copyright 2018-2026 the Deno authors. MIT license.`
      (tools/copyright_checker.js).

  - id: deno-copyright-js-ts
    kind: file_header
    paths:
      include:
        - "**/*.js"
        - "**/*.mjs"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      exclude:
        - ".github/mtime_cache/action.js"
        - "cli/tools/bench/mitata.rs"
        - "cli/tools/doc/prism.css"
        - "cli/tools/doc/prism.js"
        - "cli/tools/init/templates/**"
        - "cli/tsc/*typescript.js"
        - "cli/tsc/compiler.d.ts"
        - "cli/tsc/dts/**"
        - "ext/node/polyfills/deps/**"
        - "tests/bench/testdata/**"
        - "tests/node_compat/test/**"
        - "tests/registry/**"
        - "tests/specs/**"
        - "tests/testdata/**"
        - "tests/unit_node/testdata/**"
        - "tests/wpt/suite/**"
        - "libs/config/testdata/**"
        - "libs/eszip/testdata/**"
    # `|-` (chomp) so the block scalar does NOT append a trailing \n to
    # the regex — a source whose final line is the copyright (no newline)
    # must still match.
    pattern: |-
      ^(?:#!.*\n)?(?:// (?:deno-lint-|Ported|Copyright).*\n|\s*\n)*// Copyright 2018-2026 the Deno authors\. MIT license\.
    level: error
    message: >-
      JS/TS source files must carry the MIT copyright header
      (tools/copyright_checker.js).

  - id: deno-copyright-c
    kind: file_header
    paths:
      include: ["**/*.c"]
      exclude: ["ext/node/ops/llhttp/c/**"]
    pattern: '^// Copyright 2018-2026 the Deno authors\. MIT license\.'
    level: error

  - id: deno-copyright-cargo-toml
    kind: file_header
    paths: ["Cargo.toml", "**/Cargo.toml"]
    pattern: '^# Copyright 2018-2026 the Deno authors\. MIT license\.'
    level: error
    message: >-
      Every Cargo.toml must start with the TOML-style copyright comment.

  - id: deno-license-md-current-year
    # copyright_checker.js's `copyrightYear` constant asserts LICENSE.md
    # still mentions the current year. Plain content match.
    kind: file_content_matches
    paths: LICENSE.md
    pattern: 'Copyright 2018-2026 the Deno authors'
    level: error
    message: >-
      LICENSE.md copyright year is stale; bump it (and copyright_checker.js's
      `copyrightYear`) at year-start.

  # ═══════════════════════════════════════════════════════════════════
  # 2. ★ NEW v0.10  import_gate — the Rust permission-system firewall.
  #    ext/* / libs/* / runtime crates ban a set of std fs/path/url/env
  #    helpers that bypass Deno's permission model. The clippy.toml bans
  #    are the *enforcement*; import_gate adds a fast first-pass on the
  #    SOURCE so a raw `use std::fs::canonicalize;` is caught even before
  #    clippy compiles. (clippy still authoritative — see §8.)
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-no-raw-std-fs-in-permissioned-crates
    kind: import_gate
    language: rust
    paths:
      include:
        - "ext/**/*.rs"
        - "libs/**/*.rs"
        - "runtime/**/*.rs"
      exclude:
        - "**/tests/**"
        - "**/benches/**"
        - "**/build.rs"
        - "libs/core_testing/**"
    # import_gate keys on the EXTRACTED `use` target; flag direct std::fs
    # mutators that the clippy.toml disallowed-methods list also bans.
    forbid: '^std::fs::(canonicalize|copy|create_dir|create_dir_all|hard_link|remove_dir|remove_dir_all|remove_file|rename|read_dir|read_link|metadata|symlink_metadata)$'
    level: warning
    message: >-
      Permissioned crates must route filesystem access through the
      FileSystem/NodeFs trait, not raw std::fs (mirrors the per-crate
      clippy.toml disallowed-methods bans; clippy is authoritative).

  # ═══════════════════════════════════════════════════════════════════
  # 3. tools/lint.js → ensureDisallowedMethodsEnforced (structural half).
  #    Every ext/* and libs/* crate (minus libs/core_testing) ships a
  #    clippy.toml; libs/* additionally bans env/current_dir/time.
  #    for_each_dir presence checks + sampled content checks. The full
  #    30-method × N-crate matrix is still the residual gap (see §gaps).
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-ext-crate-has-clippy-toml
    kind: for_each_dir
    select: "ext/*"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_exists
        paths: "{path}/clippy.toml"
    level: error
    message: >-
      Every ext/* crate must ship a clippy.toml banning the common
      fs/path/url helper set (tools/lint.js).

  - id: deno-libs-crate-has-clippy-toml
    kind: for_each_dir
    select: "libs/*"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_exists
        paths: "{path}/clippy.toml"
    level: error
    message: >-
      Every libs/* crate (except core_testing) must ship a clippy.toml
      banning the common set PLUS the libs-extra env/current_dir/time set.

  - id: deno-clippy-toml-bans-fs-canonicalize
    # Sample of COMMON_METHODS. clippy.toml now uses
    # { path = "std::fs::canonicalize", reason = ... } objects, so the
    # quoted-path content match still hits.
    kind: file_content_matches
    paths:
      - "ext/*/clippy.toml"
      - "libs/*/clippy.toml"
      - "runtime/clippy.toml"
    pattern: '"std::fs::canonicalize"'
    level: error
    message: >-
      clippy.toml is missing `std::fs::canonicalize` from disallowed-methods
      (sample of the COMMON_METHODS set in tools/lint.js).

  - id: deno-libs-clippy-toml-bans-env-var
    kind: file_content_matches
    paths:
      - "libs/*/clippy.toml"
      - "runtime/permissions/clippy.toml"
    pattern: '"std::env::var"'
    level: error
    message: >-
      libs/* clippy.toml must also ban `std::env::var`
      (sample of LIBS_EXTRA_METHODS in tools/lint.js).

  # ═══════════════════════════════════════════════════════════════════
  # 4. tools/lint.js → ensureNoNewTopLevelEntries  (file half only).
  #    The curated allow-list now also lists DIRECTORIES, but
  #    dir_only_contains checks file children only, so a stray top-level
  #    *directory* still slips past (documented gap). The file allow-list
  #    mirrors lint.js's `allowed` Set.
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-no-new-top-level-files
    kind: dir_only_contains
    select: "."
    allow:
      - ".dlint.json"
      - ".dprint.json"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".gitmodules"
      - ".rustfmt.toml"
      - "CLAUDE.md"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE.md"
      - "README.md"
      - "Releases.md"
      - "import_map.json"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "x"
    level: error
    message: >-
      A new file at the repo root requires discussion; add it to this
      allow-list (and lint.js's `allowed` Set) once approved.

  # ═══════════════════════════════════════════════════════════════════
  # 5. ★ NEW v0.10  command_idempotent — ensureWorkflowYmlsUpToDate.
  #    The generators are now SELF-LINTING: `deno run --allow-read=. <gen>
  #    --lint` exits non-zero (printing the stale path) when the checked-in
  #    .generated.yml is out of date. One invocation per generator; the
  #    legacy `pair` rule only proved the sibling EXISTS, not that it is
  #    FRESH. This is the freshness half, finally declarative.
  #    (NOTE: requires `deno` on PATH at check time — CI-only.)
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-ci-workflow-fresh
    kind: command_idempotent
    command: ["deno", "run", "--allow-read=.", ".github/workflows/ci.ts", "--lint"]
    level: error
    message: "ci.generated.yml is stale — run `.github/workflows/ci.ts` and commit."

  - id: deno-pr-workflow-fresh
    kind: command_idempotent
    command: ["deno", "run", "--allow-read=.", ".github/workflows/pr.ts", "--lint"]
    level: error
    message: "pr.generated.yml is stale — run `.github/workflows/pr.ts` and commit."
    # The remaining 9 generators (cargo_publish, create_prerelease_tag,
    # ecosystem_compat_test, node_compat_test, npm_publish, post_publish,
    # promote_to_release, start_release, version_bump) follow the same
    # shape; add one command_idempotent rule per generator, or keep them on
    # tools/lint.js's ensureWorkflowYmlsUpToDate (which fans Promise.all
    # over the whole list). The two flagship workflows are wired here.

  # ═══════════════════════════════════════════════════════════════════
  # 6. Per-language config-shape guards. If someone drops the recommended
  #    tag, the deno style, or the LF rule, fail structurally.
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-dlint-keeps-recommended-tag
    when: facts.has_dlint_config
    kind: json_path_equals
    paths: .dlint.json
    path: "$.rules.tags[0]"
    equals: "recommended"
    level: warning
    message: ".dlint.json should keep `recommended` in `rules.tags`."

  - id: deno-dlint-includes-camelcase
    when: facts.has_dlint_config
    # ANY-element membership; *_path_equals against [*] would require EVERY
    # element to equal "camelcase". Regex against raw JSON until a
    # *_path_contains kind ships.
    kind: file_content_matches
    paths: .dlint.json
    pattern: '"include"\s*:\s*\[[^\]]*"camelcase"'
    level: info
    message: ".dlint.json should keep `camelcase` in `rules.include`."

  - id: deno-dprint-typescript-deno-style
    kind: json_path_equals
    paths: .dprint.json
    path: "$.typescript.deno"
    equals: true
    level: warning
    message: ".dprint.json should keep TypeScript in `deno` style."

  - id: deno-gitattributes-enforces-lf
    kind: file_content_matches
    paths: .gitattributes
    pattern: '\* text=auto eol=lf'
    level: warning
    message: ".gitattributes should keep `* text=auto eol=lf` (Windows CRLF guard)."

  # ═══════════════════════════════════════════════════════════════════
  # 7. ★ NEW v0.10  command_idempotent — the format / lint engines, now
  #    single-invocation with per-file attribution (was per-file `command`
  #    fan-out in the v0.9.17 config). One spawn each, offenders parsed.
  #    (All require deno/dprint/dlint on PATH — CI-only.)
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-dprint-check
    kind: command_idempotent
    command: ["deno", "run", "-A", "--no-config", "npm:dprint@0.50.0", "check", "--config=.dprint.json"]
    files_from: stdout
    # dprint prints "<path>:" lines for files that would change.
    files_pattern: '^(.+?):\s*$'
    timeout: 600
    level: error
    message: "Code is not dprint-clean — run `./x fmt` and commit the diff."

  - id: deno-dlint
    kind: command_idempotent
    command: ["deno", "run", "-A", "tools/lint.js", "--js"]
    files_from: stdout
    files_pattern: '^([^:]+):\d+:\d+:'
    timeout: 600
    level: error
    message: "tools/lint.js --js (dlint) findings — see output for the offending file."

  - id: deno-dlint-prefer-primordials
    # dlintPreferPrimordials: the single prefer-primordials rule over
    # runtime/** + ext/** bootstrap JS/TS.
    kind: command_idempotent
    command: ["deno", "run", "-A", "tools/lint.js", "--js", "--rule", "prefer-primordials"]
    files_from: stdout
    files_pattern: '^([^:]+):\d+:\d+:'
    timeout: 600
    level: error
    message: "prefer-primordials violation in a bootstrap file (dlintPreferPrimordials)."

  # ═══════════════════════════════════════════════════════════════════
  # 8. clippy — the two-invocation workspace gate. Kept as the legacy
  #    single-shot `command` kind: clippy emits no parseable per-file
  #    offender list (it streams compiler diagnostics), so command_idempotent
  #    buys nothing here. Single-shot, triggered by the root Cargo.toml.
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-cargo-clippy-workspace
    kind: command
    paths: Cargo.toml
    command:
      - "cargo"
      - "clippy"
      - "--all-targets"
      - "--all-features"
      - "--locked"
      - "--workspace"
      - "--exclude"
      - "deno_core"
      - "--"
      - "-D"
      - "warnings"
      - "--deny"
      - "clippy::unused_async"
      - "--deny"
      - "clippy::print_stderr"
      - "--deny"
      - "clippy::print_stdout"
      - "--deny"
      - "clippy::large_futures"
      - "--deny"
      - "clippy::allow_attributes_without_reason"
    timeout: 1800
    level: error
    message: "Workspace clippy failed (tools/lint.js → clippy(), invocation 1/2)."

  - id: deno-cargo-clippy-deno-core
    kind: command
    paths: Cargo.toml
    command:
      - "cargo"
      - "clippy"
      - "-p"
      - "deno_core"
      - "--all-targets"
      - "--locked"
      - "--features"
      - "default,unsafe_runtime_options,unsafe_use_unprotected_platform"
      - "--"
      - "-D"
      - "warnings"
      - "--deny"
      - "clippy::unused_async"
      - "--deny"
      - "clippy::print_stderr"
      - "--deny"
      - "clippy::print_stdout"
      - "--deny"
      - "clippy::large_futures"
      - "--deny"
      - "clippy::allow_attributes_without_reason"
    timeout: 1800
    level: error
    message: "deno_core clippy failed (tools/lint.js → clippy(), invocation 2/2)."

  # ═══════════════════════════════════════════════════════════════════
  # 9. ★ NEW v0.11  git_commit_* — PR hygiene. verify_pr_title.js checks
  #    the PR *title* (out of scope — not file/commit content), but the
  #    no-fixup guard IS a commit-history check alint now owns. Deno
  #    squash-merges, so residual fixup!/squash! commits should never
  #    reach a merge. (scope-limited to the PR range via ALINT_BASE_SHA.)
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-no-fixup-commits
    kind: git_commit_no_fixup
    since: "{{env.ALINT_BASE_SHA | default('origin/main')}}"
    level: warning
    message: >-
      Squash residual fixup!/squash! commits before merge
      (`git rebase --autosquash`). Deno squash-merges PRs.

  # ═══════════════════════════════════════════════════════════════════
  # 10. File-size guard — surfaces accidental binary commits. Excludes the
  #     known-large data trees + Releases.md/Cargo.lock.
  # ═══════════════════════════════════════════════════════════════════
  - id: deno-no-huge-blobs
    kind: file_max_size
    paths:
      include: ["**/*"]
      exclude:
        - "tests/testdata/**"
        - "tests/specs/**"
        - "tests/bench/testdata/**"
        - "tests/wpt/**"
        - "tests/node_compat/**"
        - "tests/registry/**"
        - "ext/node/polyfills/deps/**"
        - "cli/tsc/dts/**"
        - "cli/tsc/*typescript.js"
        - "Releases.md"
        - "Cargo.lock"
    max_bytes: 5242880  # 5 MiB
    level: warning
