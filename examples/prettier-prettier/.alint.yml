# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for prettier/prettier — re-analysis on alint v0.11.
#
# Catalogue of prettier's bespoke validations and how alint replaces them.
# Compared to the v0.9.17-era baseline (examples/prettier-prettier/.alint.yml),
# the v0.10/v0.11 kinds let us replace the per-tool runners individually
# (command_idempotent), the post-fix idempotency script (command_idempotent
# / ensure-no-files-changed), the deps-pinned check on EVERY package.json,
# and add PR-scoped changelog checks via scope_filter.changed_since.
#
# ── prettier's validation surface (catalogued) ─────────────────────────
#   Tool runners (package.json `lint:*`, all run by CI lint.yml):
#     lint:typecheck  -> tsc                       (TS AST — NOT replaceable)
#     lint:eslint     -> eslint . incl. 9 custom prettier-internal-rules
#                                                  (JS AST — NOT replaceable)
#     lint:prettier   -> prettier . --check        (self-dogfood, runner)
#     lint:spellcheck -> cspell                     (lexical — runner only)
#     lint:knip       -> knip (unused exports/deps) (JS dep-graph — NOT repl.)
#     lint:deps       -> scripts/check-deps.js      (REPLACEABLE, declarative)
#     lint:changelog  -> scripts/lint-changelog.js  (MOSTLY replaceable)
#     lint:format-test-> scripts/format-test-lint.js(runner; leaf-walk nuance)
#   CI-only extras (lint.yml):
#     yarn dedupe --check (x5 dirs), actionlint, renovate-config-validator,
#     dependency-review, ensure-no-files-changed.js (post-fix idempotency)
#   Other workflows: prevent-file-change (users.yml), check-sizes (dist),
#     eslint-rules test, autofix.ci, codeql, prod/dev tests.
#
# Replaceability summary at bottom of file.

version: 1

extends:
  - alint://bundled/oss-baseline@v1            # LICENSE, README, no secrets, etc.
  - alint://bundled/node@v1                    # root package.json, lockfile, no node_modules/dist
  - alint://bundled/ci/github-actions@v1       # pinned action SHAs (prettier already pins)
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1    # .editorconfig present & sane

rules:
  # ════════════════════════════════════════════════════════════════════
  # TOOL RUNNERS — one command_idempotent per `lint:*` step.
  # NEW vs v0.9.17: each tool surfaces as its own rule (was one wrapper
  # `command: yarn lint`). command_idempotent runs the tool in check mode;
  # for the format/eslint dogfood it captures the offender list.
  # ════════════════════════════════════════════════════════════════════

  # lint:prettier — prettier dogfoods itself. command_idempotent runs the
  # --check form; if any file would change, the tool exits non-zero.
  - id: prettier-self-format
    kind: command_idempotent
    paths: ".prettierignore"
    command: ["prettier", ".", "--check", "--cache"]
    timeout: 300
    level: warning
    message: "prettier . --check (yarn lint:prettier) — self-dogfood."

  # lint:eslint — drives the runner only; the 13 file overrides + 9
  # prettier-internal-rules/* are JS-AST analysis alint cannot express.
  - id: prettier-eslint
    kind: command_idempotent
    paths: "eslint.config.js"
    command: ["eslint", ".", "--format", "friendly"]
    timeout: 300
    level: warning
    message: "eslint . (yarn lint:eslint). NON-REPLACEABLE semantics — runner only."

  # lint:typecheck — tsc over JSDoc-typed sources. TS compiler; runner only.
  - id: prettier-typecheck
    kind: command_idempotent
    paths: "tsconfig.json"
    command: ["tsc"]
    timeout: 600
    level: warning
    message: "tsc (yarn lint:typecheck). NON-REPLACEABLE — TS AST/typecheck."

  # lint:spellcheck — cspell against cspell.json allowlist. Lexical; runner.
  - id: prettier-spellcheck
    kind: command_idempotent
    paths: "cspell.json"
    command: ["cspell", "--no-progress", "--relative", "--dot", "--gitignore"]
    timeout: 120
    level: info
    message: "cspell (yarn lint:spellcheck). NON-REPLACEABLE — lexical; runner only."

  # lint:knip — unused exports + dependency analysis. JS dep-graph; runner.
  - id: prettier-knip
    kind: command_idempotent
    paths: "knip.config.js"
    command: ["knip"]
    timeout: 300
    level: warning
    message: "knip (yarn lint:knip). NON-REPLACEABLE — JS dep-graph; runner only."

  # lint:format-test — every leaf dir under tests/format/ with non-snapshot
  # files needs a format.test.js. The leaf-walk + `.not-test-directory`
  # opt-out is more nuanced than for_each_dir alone; keep the script as runner.
  - id: prettier-format-test-lint
    kind: command_idempotent
    paths: "scripts/format-test-lint.js"
    command: ["node", "./scripts/format-test-lint.js"]
    timeout: 60
    level: warning
    message: "tests/format/* leaf dirs need format.test.js (scripts/format-test-lint.js)."

  # CI "Ensure no files changed" — post-fix idempotency. This is exactly
  # what command_idempotent models: run the project's `fix`, expect no diff.
  - id: prettier-fix-is-idempotent
    kind: command_idempotent
    paths: "package.json"
    command: ["git", "diff", "--exit-code"]
    timeout: 60
    level: warning
    message: "Working tree must be clean after generators/fixers (ensure-no-files-changed.js)."

  # ════════════════════════════════════════════════════════════════════
  # DEPS PINNING — scripts/check-deps.js, now FULLY declarative.
  # The script forbids ^/~ in dependencies/devDependencies/resolutions
  # across 5 package.json files. We replace ALL 5 (baseline did only root).
  # ════════════════════════════════════════════════════════════════════
  - id: prettier-deps-pinned
    kind: file_content_forbidden
    paths:
      include:
        - "package.json"
        - "website/package.json"
        - "scripts/release/package.json"
        - "scripts/tools/bundle-test/package.json"
        - "scripts/tools/eslint-plugin-prettier-internal-rules/package.json"
    pattern: '(?m)^\s*"[^"]+"\s*:\s*"[\^~][0-9]'
    level: error
    message: "Deps must be pinned (no ^/~). Mirrors scripts/check-deps.js across all 5 package.json."

  # ════════════════════════════════════════════════════════════════════
  # VERSION COHERENCE — cross_file_value_equals.
  # prettier's version lives in package.json; the published-package name
  # and license must match LICENSE / README. (Single-package repo: the
  # plugins carry their own versions, so we don't equate those.)
  # ════════════════════════════════════════════════════════════════════
  - id: prettier-name-canonical
    kind: json_path_matches
    paths: "package.json"
    path: "$.name"
    matches: '^prettier$'
    level: error
    message: "package.json name must be `prettier`."

  - id: prettier-license-mit
    kind: json_path_matches
    paths: "package.json"
    path: "$.license"
    matches: '^MIT$'
    level: error
    message: "package.json license must be MIT (matches LICENSE)."

  - id: prettier-engine-node-floor
    kind: json_path_matches
    paths: "package.json"
    path: "$.engines.node"
    matches: '^>=2[0-9]'
    level: warning
    message: "engines.node should declare a >=20 floor (monotonic)."

  # ════════════════════════════════════════════════════════════════════
  # CHANGELOG_UNRELEASED — scripts/lint-changelog.js, mostly replaceable.
  # NEW vs v0.9.17: scope_filter.changed_since lets the PR-shape checks
  # fire only on files touched in this PR — closer to the per-PR contract.
  # ════════════════════════════════════════════════════════════════════

  # Roster: 20 category dirs (each with .gitkeep) + 2 templates must exist.
  - id: prettier-changelog-categories-exist
    kind: file_exists
    paths:
      - "changelog_unreleased/angular/.gitkeep"
      - "changelog_unreleased/api/.gitkeep"
      - "changelog_unreleased/cli/.gitkeep"
      - "changelog_unreleased/css/.gitkeep"
      - "changelog_unreleased/flow/.gitkeep"
      - "changelog_unreleased/graphql/.gitkeep"
      - "changelog_unreleased/handlebars/.gitkeep"
      - "changelog_unreleased/html/.gitkeep"
      - "changelog_unreleased/javascript/.gitkeep"
      - "changelog_unreleased/json/.gitkeep"
      - "changelog_unreleased/less/.gitkeep"
      - "changelog_unreleased/lwc/.gitkeep"
      - "changelog_unreleased/mjml/.gitkeep"
      - "changelog_unreleased/markdown/.gitkeep"
      - "changelog_unreleased/mdx/.gitkeep"
      - "changelog_unreleased/scss/.gitkeep"
      - "changelog_unreleased/typescript/.gitkeep"
      - "changelog_unreleased/vue/.gitkeep"
      - "changelog_unreleased/yaml/.gitkeep"
      - "changelog_unreleased/misc/.gitkeep"
      - "changelog_unreleased/TEMPLATE.md"
      - "changelog_unreleased/BLOG_POST_INTRO_TEMPLATE.md"
    level: error
    message: "changelog_unreleased/ must keep one .gitkeep'd dir per category + 2 templates."

  # PR-note filename shape: <PR_NUMBER>.md (4+ digits, optional -N).
  - id: prettier-changelog-pr-filenames
    kind: filename_regex
    paths:
      include: ["changelog_unreleased/*/*.md"]
    pattern: '^[0-9]{4,}(-[0-9]+)?\.md$'
    level: error
    message: "Changelog notes must be named <PR_NUMBER>.md (scripts/lint-changelog.js)."

  # h4 title — scoped to files changed in THIS PR (per-PR contract).
  - id: prettier-changelog-pr-h4-title
    kind: file_starts_with
    paths:
      include: ["changelog_unreleased/*/*.md"]
    prefix: "#### "
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: error
    message: "Changelog notes must use #### (h4) for the title."

  # "prettier master" leakage — use "main".
  - id: prettier-changelog-no-master
    kind: file_content_forbidden
    paths:
      include: ["changelog_unreleased/*/*.md"]
    pattern: '(?i)prettier master'
    level: error
    message: 'Use "main" not "master" in changelog notes.'

  # TEMPLATE placeholder leakage (the `(#XXXX by @user)` example block).
  - id: prettier-changelog-no-template-placeholder
    kind: file_content_forbidden
    paths:
      include: ["changelog_unreleased/*/*.md"]
      exclude:
        - "changelog_unreleased/TEMPLATE.md"
        - "changelog_unreleased/BLOG_POST_INTRO_TEMPLATE.md"
    pattern: '\(#XXXX by @user\)'
    level: error
    message: "Changelog note still has the TEMPLATE.md placeholder; insert real PR# + handle."

  # Each PR note must reference its own #NNNN and an author link. The
  # script ties the # to the FILENAME (cross-name dynamic check) — alint
  # can enforce SHAPE (a PR link + an author link are present) but cannot
  # tie #NNNN to the specific filename. NEW-RULE-KIND candidate below.
  - id: prettier-changelog-has-pr-link
    kind: file_content_matches
    paths:
      include: ["changelog_unreleased/*/*.md"]
    pattern: '#\d{4,}'
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: warning
    message: "Each changelog note should reference its PR number (#NNNN)."

  - id: prettier-changelog-has-author-link
    kind: file_content_matches
    paths:
      include: ["changelog_unreleased/*/*.md"]
    pattern: 'by @[\w-]+|by \[@[\w-]+\]'
    scope_filter:
      changed_since: "{{env.ALINT_BASE_REF | default('origin/main')}}"
    level: warning
    message: "Each changelog note should include an author link (by @handle)."

  # ════════════════════════════════════════════════════════════════════
  # PUBLISHED PLUGIN PACKAGES — packages/plugin-* shape + scope.
  # ════════════════════════════════════════════════════════════════════
  - id: prettier-plugin-package-shape
    kind: for_each_dir
    select: "packages/*"
    when_iter: 'iter.has_file("package.json")'
    require:
      - kind: file_exists
        paths: "{path}/index.js"
      - kind: file_exists
        paths: "{path}/README.md"
    level: error
    message: "Each packages/plugin-* needs index.js + package.json + README.md (ships to npm)."

  - id: prettier-plugin-scope
    kind: json_path_matches
    paths: "packages/plugin-*/package.json"
    path: "$.name"
    matches: '^@prettier/plugin-'
    level: error
    message: "Published plugins live under the @prettier/ scope."

  # ════════════════════════════════════════════════════════════════════
  # PER-LANGUAGE-PLUGIN CONVENTIONS — not enforced by any prettier script
  # today (review/repo-memory only). alint makes them declarative.
  # ════════════════════════════════════════════════════════════════════
  - id: prettier-language-plugin-has-index
    kind: for_each_dir
    select: "src/language-*"
    require:
      - kind: file_exists
        paths: "{path}/index.js"
    level: error
    message: "Every src/language-*/ plugin must export index.js."

  - id: prettier-language-plugin-has-languages-evaluate
    kind: for_each_dir
    select: "src/language-*"
    require:
      - kind: file_exists
        paths: "{path}/languages.evaluate.js"
    level: error
    message: "Every src/language-*/ plugin must ship languages.evaluate.js."

  # ════════════════════════════════════════════════════════════════════
  # KEY-FILE PRESENCE SMOKE CHECKS (cheap, catch accidental deletion).
  # ════════════════════════════════════════════════════════════════════
  - id: prettier-prettierignore-exists
    kind: file_exists
    paths: ".prettierignore"
    root_only: true
    level: error
    message: ".prettierignore is required for the dogfood loop."

  - id: prettier-dogfood-config-exists
    kind: file_exists
    paths: "prettier.config.js"
    root_only: true
    level: error
    message: "prettier.config.js is the dogfood config."

  - id: prettier-knip-config-exists
    kind: file_exists
    paths: "knip.config.js"
    root_only: true
    level: warning
    message: "knip.config.js drives yarn lint:knip."

  # ── website/data/users.yml change-protection ──────────────────────────
  # prevent-file-change.yml blocks PR edits to website/data/users.yml.
  # This is a GitHub-workflow social gate (pull_request_target + reviewer);
  # NOT expressible as a content rule — alint can't say "this file may not
  # be MODIFIED in a PR" (only "must/must-not match a pattern"). NON-REPL.

# ════════════════════════════════════════════════════════════════════════
# REPLACEABILITY SUMMARY
# ════════════════════════════════════════════════════════════════════════
# REPLACED (declarative, no shellout):
#   check-deps.js (all 5 package.json), changelog roster/filename/h4/master/
#   template-placeholder/pr-link/author-link shape, version+license+engine
#   coherence, plugin-package shape+scope, language-plugin conventions,
#   key-file presence.
# REPLACED AS RUNNER (command_idempotent surfacing existing tool):
#   prettier --check, eslint, tsc, cspell, knip, format-test-lint,
#   ensure-no-files-changed (git diff --exit-code).
# NON-REPLACEABLE (genuine semantics alint cannot express):
#   - tsc           : TypeScript typechecking (TS AST)
#   - eslint        : JS AST incl. 9 custom prettier-internal-rules
#   - knip          : JS module dep-graph / unused-export analysis
#   - cspell        : lexical spellcheck vs allowlist
#   - jest snapshot test harness (tests/format, integration) — runtime tests
#   - check-sizes   : compressed dist-bundle size diff vs base (build+gzip)
#   - actionlint / renovate-config-validator / dependency-review — external
#                     validators with their own schemas
#   - prevent-file-change: "file may not be MODIFIED in a PR" (VCS-diff gate)
#   - yarn dedupe --check: package-manager-internal dedup invariant
#
# NEW-RULE-KIND CANDIDATES:
#   1. "changed-files-must-add-under-X" (the changelog_unreleased-per-PR
#      requirement): prettier requires every PR to ADD a file under
#      changelog_unreleased/<cat>/. scope_filter.changed_since tells alint
#      WHICH files changed, but there's no kind asserting "the changed set
#      MUST include >=1 new path matching <glob>". Strongest gap.
#   2. "filename-token-equals-content" : tie the #NNNN inside a changelog
#      note to its own filename (cross-name dynamic equality).
#   3. "modified-files-forbidden" : VCS-diff gate (prevent-file-change).
