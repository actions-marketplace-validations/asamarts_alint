name: compliance/apache-2@v1 — SPDX headers, generated source, and third_party/ stay silent (v0.12)
tags: [check, bundled, compliance, apache-2, regression]

# v0.12 ASF over-fire fix. With LICENSE + NOTICE present, the
# source-header rule must NOT fire on:
#   1. files carrying the modern SPDX id (CNCF / branded headers);
#   2. generated source by naming convention (*.pb.go,
#      zz_generated.*.go, *_pb2.py, ...) — codegen has its own header
#      or none;
#   3. third_party/ vendored trees.
# All three over-fired on helm / istio / kubernetes / tensorflow before
# this. The plain-header source file with no Apache header would still
# fire (see apache_2_missing_source_header.yml); here every file is
# either SPDX-headed or excluded, so the run is clean.

given:
  tree:
    LICENSE: |
      Apache License
      Version 2.0, January 2004
    NOTICE: |
      Copyright 2026 Acme Corp
    src:
      # Modern SPDX header form — must be accepted by the broadened pattern.
      spdx_header.go: |
        // SPDX-License-Identifier: Apache-2.0
        package main
    api:
      # Generated protobuf (no ASF header) — excluded by **/*.pb.go.
      service.pb.go: |
        // Code generated by protoc-gen-go. DO NOT EDIT.
        package api
      # k8s / istio codegen (no header) — excluded by **/zz_generated.*.go.
      zz_generated.deepcopy.go: |
        package api
      # Python protobuf (no header) — excluded by **/*_pb2.py.
      service_pb2.py: |
        # Generated by the protocol buffer compiler. DO NOT EDIT!
        VALUE = 1
    third_party:
      # Vendored source with no ASF header — excluded by **/third_party/**.
      vendored.go: |
        package vendored
  config: |
    version: 1
    extends:
      - alint://bundled/compliance/apache-2@v1

when: [check]

expect:
  - violations: []
