name: alint://bundled/php no-ops in a non-PHP repo
tags: [check, extends, bundled, php]

# No composer.json anywhere → facts.has_php is false → every rule
# is gated off. The ruleset is a silent no-op, so it is safe to
# extend unconditionally in a polyglot monorepo.

given:
  tree:
    "README.md": "# not a php project\n"
    "main.go": "package main\n"
  config: |
    version: 1
    extends:
      - alint://bundled/php@v1

when: [check]

expect:
  - violations: []
