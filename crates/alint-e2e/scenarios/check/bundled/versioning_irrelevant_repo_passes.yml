name: versioning bundle is silent without the declared VERSION authority
tags: [check, extends, bundled, versioning, applicability]

given:
  tree:
    package.json: |
      {"name":"library","version":"1.2.3"}
    CHANGELOG.md: |
      # Changelog

      ## 1.2.3
  config: |
    version: 1
    extends:
      - alint://bundled/versioning@v1

when: [check]

expect:
  - violations: []
