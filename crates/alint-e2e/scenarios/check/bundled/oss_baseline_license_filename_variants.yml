name: alint://bundled/oss-baseline accepts LICENSE.TXT + LICENSE.rst variants (v0.9.18 A5)
tags: [check, extends, bundled, oss-baseline, regression]

# v0.9.18 A5 regression — `oss-license-exists` and
# `oss-license-non-empty` must recognise the case-variation +
# Python-RST license filename forms surfaced across the case-study
# corpus. Pre-fix, dotnet/runtime's `LICENSE.TXT` (uppercase)
# tripped the rule because filesystem globs are case-sensitive.
#
# Fixture asserts the dotnet/runtime + Python-RST shapes pass
# without violations from the license rules.

given:
  tree:
    README.md: |
      # demo

      A brief description of the demo project.
      Install: `cargo install demo`.
    # dotnet/runtime canonical shape — uppercase extension.
    LICENSE.TXT: |
      The MIT License (MIT)

      Copyright (c) .NET Foundation and Contributors

      All rights reserved.

      Permission is hereby granted, free of charge, to any
      person obtaining a copy of this software and associated
      documentation files (the "Software"), to deal in the
      Software without restriction...
    SECURITY.md: |
      # Security Policy

      ## Reporting

      Report vulnerabilities privately to security@example.com.
      We aim to acknowledge reports within 72 hours and ship a
      patch within 14 days for high-severity issues.

      ## Supported versions

      Only the latest minor release receives security updates.
    CODE_OF_CONDUCT.md: "# Code of Conduct\n\nBe kind.\n"
    .gitignore: "target/\n"
    .github:
      dependabot.yml: |
        version: 2
        updates:
          - package-ecosystem: cargo
            directory: "/"
            schedule:
              interval: weekly
      CODEOWNERS: |
        * @demo/maintainers
  config: |
    version: 1
    extends:
      - alint://bundled/oss-baseline@v1

when: [check]

expect:
  - violations: []
