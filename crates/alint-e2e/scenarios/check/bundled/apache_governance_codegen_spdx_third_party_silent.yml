name: apache/governance@v1 — SPDX headers, generated source, and third_party/ stay silent (v0.12)
tags: [check, extends, bundled, apache-governance, regression]

# v0.12 ASF over-fire fix, governance side (kept verbatim-lockstep with
# compliance/apache-2@v1). With every required TLP artefact present
# (LICENSE, ASF-attributed NOTICE, KEYS, README, CHANGELOG), the
# source-header rule must stay silent on SPDX headers, generated source
# (*.pb.go / zz_generated.*.go / *_pb2.py), and third_party/ trees, and
# the no-binaries rule must ignore third_party/.

given:
  tree:
    LICENSE: |
      Apache License
      Version 2.0, January 2004
      http://www.apache.org/licenses/
    NOTICE: |
      Apache Demo
      Copyright 2026 The Apache Software Foundation
    KEYS: |
      -----BEGIN PGP PUBLIC KEY BLOCK-----
      (release managers' signing keys)
      -----END PGP PUBLIC KEY BLOCK-----
    README.md: |
      # Apache Demo

      A demonstration Apache TLP repository.
    CHANGELOG.md: |
      # Changes

      ## 1.0.0
      - Initial release.
    src:
      # Modern SPDX header form — must be accepted.
      spdx_header.go: |
        // SPDX-License-Identifier: Apache-2.0
        package main
    api:
      service.pb.go: |
        // Code generated by protoc-gen-go. DO NOT EDIT.
        package api
      zz_generated.deepcopy.go: |
        package api
      service_pb2.py: |
        # Generated by the protocol buffer compiler. DO NOT EDIT!
        VALUE = 1
    third_party:
      vendored.go: |
        package vendored
  config: |
    version: 1
    extends:
      - alint://bundled/apache/governance@v1

when: [check]

expect:
  - violations: []
