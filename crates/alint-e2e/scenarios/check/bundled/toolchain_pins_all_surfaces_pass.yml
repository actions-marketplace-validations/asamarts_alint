name: toolchain-pins bundle accepts matching exact pins across all six ecosystems
tags: [check, extends, bundled, toolchain_pins, cross_file, polyglot]

given:
  tree:
    .nvmrc: "22.14.0\n"
    .node-version: "22.14.0\n"
    rust-toolchain.toml: |
      [toolchain]
      components = ["rustfmt", "clippy"]
      channel = "1.90.0"
    rust-toolchain: |
      [toolchain]
      channel = "1.90.0"
      components = ["rustfmt"]
    .python-version: "3.13.7\n"
    runtime.txt: "python-3.13.7\n"
    Pipfile: |
      [requires]
      python_full_version = "3.13.7"
    .ruby-version: "3.4.5\n"
    Gemfile: |
      source "https://rubygems.org"
      ruby "3.4.5"
    Gemfile.lock: |
      RUBY VERSION
         ruby 3.4.5p12
    .java-version: "temurin-21.0.8+9\n"
    .sdkmanrc: "java=temurin-21.0.8+9\n"
    global.json: |
      {"sdk":{"version":"9.0.306"},"tools":{"dotnet":"9.0.306"}}
    .tool-versions: |
      nodejs 22.14.0
      rust 1.90.0
      python 3.13.7
      ruby 3.4.5
      java temurin-21.0.8+9
      dotnet-core 9.0.306
    package.json: |
      {"name":"demo","engines":{"node":"22.14.0"}}
    Dockerfile: |
      FROM node:22.14.0-alpine AS web
      FROM rust:1.90.0-bookworm AS rust-build
      FROM python:3.13.7-slim AS python-build
      FROM ruby:3.4.5-alpine AS ruby-build
      FROM eclipse-temurin:21.0.8_9-jdk AS java-build
      FROM mcr.microsoft.com/dotnet/sdk:9.0.306-alpine AS dotnet-build
    .github:
      workflows:
        ci.yml: |
          name: CI
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22.14.0'
                - uses: actions-rust-lang/setup-rust-toolchain@v1
                  with:
                    toolchain: '1.90.0'
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.13.7'
                - uses: ruby/setup-ruby@v1
                  with:
                    ruby-version: '3.4.5'
                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '21.0.8'
                - uses: actions/setup-dotnet@v5
                  with:
                    dotnet-version: '9.0.306'
  config: |
    version: 1
    extends:
      - alint://bundled/toolchain-pins@v1

when: [check]

expect:
  - violations: []
