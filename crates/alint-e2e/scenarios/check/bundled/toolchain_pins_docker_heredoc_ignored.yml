name: toolchain-pins bundle repairs real Docker FROM pins without touching heredoc payloads
tags: [check, fix, extends, bundled, toolchain_pins, cross_file, node, boundary]

given:
  tree:
    .nvmrc: "22.14.0\n"
    Dockerfile: |
      FROM node:22.13.1-alpine
      RUN <<'SCRIPT'
      FROM node:20.0.0-alpine
      SCRIPT
  config: |
    version: 1
    extends:
      - alint://bundled/toolchain-pins@v1

when: [check, fix_unsafe, check]

expect:
  - violations:
      - {rule: toolchain-node-dockerfiles-coherent, level: warning, path: Dockerfile}
  - applied:
      - toolchain-node-dockerfiles-coherent
  - violations: []

expect_tree:
  .nvmrc: "22.14.0\n"
  Dockerfile: |
    FROM node:22.14.0-alpine
    RUN <<'SCRIPT'
    FROM node:20.0.0-alpine
    SCRIPT
