name: git_commit_author_allowlist stays silent when there is no git repo
tags: [check, git_commit_author_allowlist, git, passing]

# No `given.git:` block — the tempdir is not a git repo. The rule
# silently no-ops outside a git repo, matching the rest of the
# git-aware family.

given:
  tree:
    README.md: "# demo\n"
  config: |
    version: 1
    rules:
      - id: org-authors
        kind: git_commit_author_allowlist
        email_pattern: '^.+@example\.com$'
        level: error

when: [check]

expect:
  - violations: []
