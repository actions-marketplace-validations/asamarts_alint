test_version: 1
name: git_commit_gpg_signed fails closed outside a Git repository
tags: [check, git_commit_gpg_signed, git]

# The unconditional commit-history capability must be available before dispatch.

capabilities:
  host_keyring: true

given:
  tree:
    README.md: "# demo\n"
  config: |
    version: 1
    rules:
      - id: signed-commits
        kind: git_commit_gpg_signed
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations: []
    analysis_failures:
      - {rule: signed-commits, kind: resource_read}
