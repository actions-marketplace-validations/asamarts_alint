name: git_blame_age reports unavailable Git outside a repository
tags: [check, git_blame_age, git]

# The kind's unconditional Git capability fails closed before dispatch.

given:
  tree:
    src:
      main.rs: "// TODO ancient marker that would fire if blame worked\nfn main() {}\n"
  config: |
    version: 1
    rules:
      - id: stale-todos
        kind: git_blame_age
        paths: "**/*.rs"
        pattern: 'TODO'
        max_age_days: 30
        level: warning

when: [check]

expect:
  - violations: []
    analysis_failures:
      - {rule: stale-todos, kind: resource_read}
