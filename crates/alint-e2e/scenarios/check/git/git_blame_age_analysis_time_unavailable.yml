name: git_blame_age reports unavailable analysis time outside a git repo
tags: [check, git_blame_age, git]

# No `given.git:` block and no explicit analysis time: the deterministic HEAD fallback is
# unavailable. W7 surfaces that as a rule-evaluation error; W2 will promote it to a typed,
# always-error analysis failure.

given:
  tree:
    src:
      main.rs: "// TODO ancient marker that would fire if blame worked\nfn main() {}\n"
  config: |
    version: 1
    rules:
      - id: stale-todos
        kind: git_blame_age
        paths: "**/*.rs"
        pattern: 'TODO'
        max_age_days: 30
        level: warning

when: [check]

expect:
  - violations:
      - {rule: stale-todos, level: warning}
