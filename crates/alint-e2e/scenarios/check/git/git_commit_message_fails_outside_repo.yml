test_version: 1
name: git_commit_message fails closed outside a Git repository
tags: [check, git_commit_message, git]

# The unconditional commit-history capability must be available before dispatch.

given:
  tree:
    README.md: "# demo\n"
  config: |
    version: 1
    rules:
      - id: conventional-commit
        kind: git_commit_message
        pattern: '^(feat|fix|chore): '
        level: warning

when: [check]

expect:
  - exit: policy_failure
    violations: []
    analysis_failures:
      - {rule: conventional-commit, kind: resource_read}
