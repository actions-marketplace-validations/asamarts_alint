name: git_commit_subject_matches stays silent when there is no git repo
tags: [check, git_commit_subject_matches, git, passing]

# No `given.git:` block — the tempdir is not a git repo. The rule
# silently no-ops because there is no commit subject to validate.

given:
  tree:
    README.md: "# demo\n"
  config: |
    version: 1
    rules:
      - id: subject-grammar
        kind: git_commit_subject_matches
        matches: '^[a-z0-9_/.-]+: [a-z].*$'
        level: error

when: [check]

expect:
  - violations: []
