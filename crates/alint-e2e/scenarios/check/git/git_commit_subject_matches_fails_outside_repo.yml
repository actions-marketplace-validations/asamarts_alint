name: git_commit_subject_matches fails closed outside a Git repository
tags: [check, git_commit_subject_matches, git]

# The unconditional commit-history capability must be available before dispatch.

given:
  tree:
    README.md: "# demo\n"
  config: |
    version: 1
    rules:
      - id: subject-grammar
        kind: git_commit_subject_matches
        matches: '^[a-z0-9_/.-]+: [a-z].*$'
        level: error

when: [check]

expect:
  - violations: []
    analysis_failures:
      - {rule: subject-grammar, kind: resource_read}
