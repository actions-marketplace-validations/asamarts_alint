name: nested Git dependency fails once at its owning top-level rule
tags: [check, for_each_dir, nested, git]

given:
  tree:
    pkg:
      app:
        source.txt: "content\n"
  config: |
    version: 1
    rules:
      - id: package-required-file
        kind: for_each_dir
        select: "pkg/*"
        require:
          - kind: git_blame_age
            paths: "{path}/*.txt"
            pattern: content
            max_age_days: 30
        level: warning

when: [check]

expect:
  - violations: []
    analysis_failures:
      - {rule: package-required-file, kind: resource_read}
