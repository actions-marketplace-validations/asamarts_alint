name: git_commit_gpg_signed stays silent when there is no git repo
tags: [check, git_commit_gpg_signed, git, passing]

# No `given.git:` block — the tempdir is not a git repo. The rule
# silently no-ops outside a git repo, matching the rest of the
# git-aware family.

given:
  tree:
    README.md: "# demo\n"
  config: |
    version: 1
    rules:
      - id: signed-commits
        kind: git_commit_gpg_signed
        level: error

when: [check]

expect:
  - violations: []
