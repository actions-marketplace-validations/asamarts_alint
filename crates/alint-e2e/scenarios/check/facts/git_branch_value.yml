test_version: 1
name: git_branch fact exposes the current branch for when-gating
tags: [check, facts, git_branch]

given:
  tree:
    # The runner creates the deterministic `main` branch used below.
    branch.txt: "branch fixture\n"
    README.md: "# demo"
  git:
    commit: false
  config: |
    version: 1
    facts:
      - id: branch
        git_branch: {}
    rules:
      - id: release-needs-changelog
        when: facts.branch == "main"
        kind: file_exists
        paths: CHANGELOG.md
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: release-needs-changelog, level: error}
