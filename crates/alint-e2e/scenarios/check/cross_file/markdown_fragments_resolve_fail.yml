test_version: 1
name: markdown_fragments_resolve catches stale deep links

tags: [check, markdown_fragments_resolve, cross_file, failing]

docs:
  title: A fragment that names no target heading is reported
  case: fail
  kind: markdown_fragments_resolve

given:
  tree:
    README.md: |
      # Project

      Read the [installation guide](docs/guide.md#installing).
    docs/guide.md: |
      # Guide

      ## Setup
  config: |
    version: 1
    rules:
      - id: heading-links
        kind: markdown_fragments_resolve
        paths: "**/*.md"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: heading-links, level: error, path: README.md}
