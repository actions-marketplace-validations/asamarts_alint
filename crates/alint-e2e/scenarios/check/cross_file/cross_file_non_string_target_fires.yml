test_version: 1
name: cross_file reports a non-string target extraction

tags: [check, cross_file, structured, failing]

# A typed target number is reported once as a type mismatch. Relation
# evaluation stops instead of treating the unusable target set as empty.
given:
  tree:
    source.json: |
      {"version": "7"}
    target.json: |
      {"version": 7}
  config: |
    version: 1
    rules:
      - id: versions-match
        kind: cross_file
        source: { file: source.json, extract: { json: "$.version" } }
        targets: [{ file: target.json, extract: { json: "$.version" } }]
        relation: equals
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: versions-match, level: error, path: target.json}
