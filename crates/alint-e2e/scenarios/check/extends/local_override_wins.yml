test_version: 1
name: local rule with the same id overrides the inherited one
tags: [check, extends]

given:
  tree:
    # The inherited config is a package asset, separate from the repository.
    stale.bak: ""

  config: |
    version: 1
    extends: [./support/local_override_wins.yaml]
    rules:
      - id: no-bak
        kind: file_absent
        paths: "**/*.bak"
        level: warning   # child downgrades error → warning

when: [check]

expect:
  # Child-level `warning` wins. If inheritance were wrong the level
  # would be `error`.
  - exit: success
    violations:
      - {rule: no-bak, level: warning, path: stale.bak}
