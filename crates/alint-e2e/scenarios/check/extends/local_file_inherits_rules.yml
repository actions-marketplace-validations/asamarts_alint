test_version: 1
name: extends pulls rules from a sibling YAML file
tags: [check, extends]

given:
  tree:
    # The inherited config is a package asset, separate from the repository.
    stale.bak: ""
    # README intentionally missing — tests that the inherited rule
    # fires from the extended file.

  config: |
    version: 1
    extends: [./support/local_file_inherits_rules.yaml]
    rules:
      - id: local-extra
        kind: file_exists
        paths: LICENSE
        level: warning

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: has-readme, level: error}
      - {rule: no-bak, level: warning, path: stale.bak}
      - {rule: local-extra, level: warning}
