name: pinned_references catches mutable build inputs across consumers

tags: [check, pinned_references, content, security, failing]

docs:
  title: Mutable CI and container references are reported
  case: fail
  kind: pinned_references

given:
  tree:
    .github/workflows/ci.yml: |
      jobs:
        call:
          uses: owner/repo/.github/workflows/test.yml@main
    actions/demo/action.yml: |
      runs:
        using: composite
        steps:
          - uses: actions/checkout@v4
    .pre-commit-config.yaml: |
      repos:
        - repo: https://github.com/pre-commit/pre-commit-hooks
          rev: v5.0.0
        - repo: https://example.test/missing-rev
    .circleci/config.yml: |
      version: 2.1
      orbs:
        node: circleci/node@volatile
    .gitlab-ci.yml: |
      test:
        image: alpine:latest
        script: echo test
    cloudbuild.yaml: |
      steps:
        - name: gcr.io/cloud-builders/docker:latest
    Dockerfile: |
      FROM rust:1.90
      ADD https://example.test/tool /usr/local/bin/tool
  config: |
    version: 1
    rules:
      - id: immutable-build-inputs
        kind: pinned_references
        paths:
          - .github/workflows/*.yml
          - "**/action.yml"
          - .pre-commit-config.yaml
          - .circleci/config.yml
          - .gitlab-ci.yml
          - cloudbuild.yaml
          - Dockerfile
        level: error

when: [check]

expect:
  - violations:
      - {rule: immutable-build-inputs, level: error, path: .circleci/config.yml, line: 3, column: 9, end_line: 3, end_column: 31}
      - {rule: immutable-build-inputs, level: error, path: .github/workflows/ci.yml, line: 3, column: 11, end_line: 3, end_column: 53}
      - {rule: immutable-build-inputs, level: error, path: .gitlab-ci.yml, line: 2, column: 10, end_line: 2, end_column: 23}
      - {rule: immutable-build-inputs, level: error, path: .pre-commit-config.yaml, line: 3, column: 10, end_line: 3, end_column: 16}
      - {rule: immutable-build-inputs, level: error, path: .pre-commit-config.yaml, line: 4, column: 11, end_line: 4, end_column: 43}
      - {rule: immutable-build-inputs, level: error, path: Dockerfile, line: 1, column: 1, end_line: 1, end_column: 15}
      - {rule: immutable-build-inputs, level: error, path: Dockerfile, line: 2, column: 1, end_line: 2, end_column: 50}
      - {rule: immutable-build-inputs, level: error, path: actions/demo/action.yml, line: 4, column: 13, end_line: 4, end_column: 32}
      - {rule: immutable-build-inputs, level: error, path: cloudbuild.yaml, line: 2, column: 11, end_line: 2, end_column: 46}
