test_version: 1
name: ordered_block with no markers sorts the whole file
tags: [check, ordered_block, content]

given:
  tree:
    dictionary.txt: |
      apple
      cherry
      banana
  config: |
    version: 1
    rules:
      - id: dictionary-sorted
        kind: ordered_block
        paths: "dictionary.txt"
        comparator: lexical
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: dictionary-sorted, level: error, path: dictionary.txt}
