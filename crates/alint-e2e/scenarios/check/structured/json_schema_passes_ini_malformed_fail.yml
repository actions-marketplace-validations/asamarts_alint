name: json_schema_passes flags malformed INI as one parse analysis failure
tags: [check, json_schema_passes, structured, ini, failing]

# The INI parse-error path (symmetry with the dotenv/properties/XML malformed
# scenarios): an unclosed section header fails to parse and yields exactly ONE
# parse analysis failure, not a flood.

given:
  tree:
    schemas:
      any.schema.json: |
        {
          "$schema": "https://json-schema.org/draft/2020-12/schema",
          "type": "object"
        }
    "config.ini": |
      [server
      port = 8080
  config: |
    version: 1
    rules:
      - id: ini-parse
        kind: json_schema_passes
        paths: "config.ini"
        schema_path: "schemas/any.schema.json"
        level: error

when: [check]

expect:
  - violations: []
    analysis_failures:
      - {rule: ini-parse, kind: resource_parse, path: config.ini}
