test_version: 1
name: sync_from on equals declines a non-literal (interpolated) target, no crash
# Regression gate: a target whose captured value is an interpolated
# `${VERSION}` template. The check skips it as a note and fires a keyless
# "no literal value" violation. Notes are partitioned before fixpoint identity
# merging, so `fix` runs cleanly, and the fixer must not clobber the template
# (it declines).
tags: [fix, cross_file, sync_from, applicability]

given:
  tree:
    VERSION: "2.5.0\n"
    deploy.yml: "image: myapp:${VERSION}\n"
  config: |
    version: 1
    rules:
      - id: img-version
        kind: cross_file
        relation: equals
        source: { file: VERSION, extract: { regex: "([0-9.]+)" } }
        targets:
          - { file: deploy.yml, extract: { regex: "myapp:(\\S+)" } }
        level: error
        fix: { sync_from: {} }

when: [check, fix_unsafe, check]

expect:
  - exit: policy_failure
    violations:
      - {rule: img-version, level: error, path: deploy.yml}
  - exit: policy_failure
    skipped: [img-version]
  - exit: policy_failure
    violations:
      - {rule: img-version, level: error, path: deploy.yml}

expect_tree:
  VERSION: "2.5.0\n"
  deploy.yml: "image: myapp:${VERSION}\n"
