test_version: 1
name: a default command fix is suggested (not run) under a bare fix
# The default tier is Unsafe: a BARE `alint fix` must SUGGEST the command, not run
# it (only `--unsafe-fixes` runs an unpromoted command). The `[check, fix]` shape
# asserts the bare fix step SUGGESTS. Unix-only (/bin/sh).
tags: [fix, command, applicability, unix-only]

capabilities:
  spawn: true

given:
  tree:
    src:
      a.js: "const x = 1\n"
  config: |
    version: 1
    rules:
      - id: js
        kind: command
        paths: "src/**/*.js"
        command: ["sh", "-c", "grep -q FIXED \"$1\"", "_", "{path}"]
        level: error
        fix:
          command:
            run: ["sh", "-c", "printf FIXED > \"$1\"", "_", "{path}"]

when: [check, fix]

expect:
  - exit: policy_failure
    violations:
      - {rule: js, level: error, path: src/a.js}
  - exit: policy_failure
    suggested: [js]
