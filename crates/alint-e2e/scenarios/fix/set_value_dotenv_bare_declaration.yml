name: set_value assigns a dotenv bare declaration
tags: [fix, dotenv_path_equals, set_value, dotenv]

# adotenv 0.2 represents `PORT` as a key with no assigned value. The native
# editor inserts `=8080` at the key boundary; the sibling remains byte-identical.

given:
  tree:
    .env: "PORT\nKEEP=x\n"
  config: |
    version: 1
    rules:
      - id: port
        kind: dotenv_path_equals
        paths: "**/.env"
        path: "$.PORT"
        equals: "8080"
        level: error
        fix:
          set_value: {}

when: [check, fix, check]

expect:
  - violations:
      - {rule: port, level: error, path: .env}
  - applied: [port]
  - violations: []

expect_tree:
  .env: "PORT=8080\nKEEP=x\n"
