test_version: 1
name: set_value rewrites a dotenv value, preserving export + comment + siblings
tags: [fix, dotenv_path_equals, set_value, dotenv]

# adotenv's lossless document editor supplies the exact native value-token edit
# at `$.NODE_ENV`, so the `export ` prefix, sibling `PORT` line, and inline
# comment all survive. The existing value is unquoted and the new value remains
# safely unquoted. A scalar replaces an existing scalar, so a bare `fix` applies.

given:
  tree:
    .env: |
      export NODE_ENV=development
      PORT=3000 # server port
  config: |
    version: 1
    rules:
      - id: node-env
        kind: dotenv_path_equals
        paths: "**/.env"
        path: "$.NODE_ENV"
        equals: "production"
        level: error
        fix:
          set_value: {}

when: [check, fix, check]

expect:
  - exit: policy_failure
    violations:
      - {rule: node-env, level: error, path: .env}
  - exit: success
    applied: [node-env]
  - exit: success
    violations: []

expect_tree:
  .env: |
    export NODE_ENV=production
    PORT=3000 # server port
