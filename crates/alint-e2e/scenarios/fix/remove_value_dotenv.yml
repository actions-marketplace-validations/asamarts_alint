name: remove_value deletes a dotenv line (with its inline comment), keeping siblings
tags: [fix, dotenv_path_absent, remove_value, dotenv]

# `remove_value` deletes the whole SECRET declaration, including its inline
# comment and final line ending. Declarations may span physical lines; this
# fixture uses one. Siblings remain untouched. The rule promotes the normally
# Unsafe removal to safe so a bare fix applies.

given:
  tree:
    .env: |
      KEEP=1
      SECRET=leak # do not commit
      ALSO=2
  config: |
    version: 1
    rules:
      - id: no-secret
        kind: dotenv_path_absent
        paths: "**/.env"
        path: "$.SECRET"
        level: error
        fix:
          remove_value: { applicability: safe }

when: [check, fix, check]

expect:
  - violations:
      - {rule: no-secret, level: error, path: .env}
  - applied: [no-secret]
  - violations: []

expect_tree:
  .env: |
    KEEP=1
    ALSO=2
