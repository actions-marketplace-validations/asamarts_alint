test_version: 1
name: toolchain-pins bundle repairs declarations without touching inert embedded text
tags: [check, fix, fix_unsafe, extends, bundled, toolchain_pins, cross_file, boundary]

given:
  tree:
    .nvmrc: "22.14.0\n"
    Dockerfile-prod: |
      RUN <<'SCRIPT'
      FROM node:22.14.0-alpine
      SCRIPT
      FROM node:22.13.1-alpine
    rust-toolchain.toml: |
      [toolchain]
      channel = "1.90.0"
    rust-toolchain: |
      [toolchain]
      notes = """
      channel = "1.90.0"
      """
      channel = "1.89.0"
    .python-version: "3.13.7\n"
    Pipfile: |
      [requires]
      notes = """
      python_full_version = "3.13.7"
      """
      python_full_version = "3.13.6"
    .ruby-version: "3.3.8\n"
    Gemfile: |
      =begin
      ruby "3.3.8"
      =end
      if false
        ruby "3.3.8"
      end
      example = <<'RUBY'
      ruby "3.3.8"
      RUBY
      ruby "3.3.7"
  config: |
    version: 1
    extends:
      - alint://bundled/toolchain-pins@v1

when: [check, fix_unsafe, check]

expect:
  - exit: success
    violations:
      - {rule: toolchain-node-dockerfiles-coherent, level: warning, path: Dockerfile-prod}
      - {rule: toolchain-rust-declarations-coherent, level: warning, path: rust-toolchain}
      - {rule: toolchain-python-declarations-coherent, level: warning, path: Pipfile}
      - {rule: toolchain-ruby-declarations-coherent, level: warning, path: Gemfile}
  - exit: success
    applied:
      - toolchain-node-dockerfiles-coherent
      - toolchain-rust-declarations-coherent
      - toolchain-python-declarations-coherent
      - toolchain-ruby-declarations-coherent
  - exit: success
    violations: []

expect_tree:
  .nvmrc: "22.14.0\n"
  Dockerfile-prod: |
    RUN <<'SCRIPT'
    FROM node:22.14.0-alpine
    SCRIPT
    FROM node:22.14.0-alpine
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.90.0"
  rust-toolchain: |
    [toolchain]
    notes = """
    channel = "1.90.0"
    """
    channel = "1.90.0"
  .python-version: "3.13.7\n"
  Pipfile: |
    [requires]
    notes = """
    python_full_version = "3.13.7"
    """
    python_full_version = "3.13.7"
  .ruby-version: "3.3.8\n"
  Gemfile: |
    =begin
    ruby "3.3.8"
    =end
    if false
      ruby "3.3.8"
    end
    example = <<'RUBY'
    ruby "3.3.8"
    RUBY
    ruby "3.3.8"
