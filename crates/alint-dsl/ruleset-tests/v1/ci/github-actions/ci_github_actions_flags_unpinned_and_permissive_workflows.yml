test_version: 1
name: alint://bundled/ci/github-actions flags mutable actions, workflows, and images
tags: [check, extends, bundled, ci]

given:
  tree:
    ".github":
      workflows:
        # Hardened workflow — should pass all three bundled rules.
        "ok.yml": |
          name: OK
          on: push
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b
                - run: echo hi
        # Missing `name:`, missing `permissions.contents: read`, and mutable
        # references in a reusable workflow, action step, and container image.
        "bad.yml": |
          on: push
          jobs:
            call:
              uses: owner/repo/.github/workflows/test.yml@main
            test:
              runs-on: ubuntu-latest
              container: alpine:latest
              steps:
                - uses: actions/checkout@v4
                - run: echo hi
      actions:
        demo:
          "action.yml": |
            runs:
              using: composite
              steps:
                - uses: owner/action@main
  config: |
    version: 1
    extends:
      - alint://bundled/ci/github-actions@v1

when: [check]

expect:
  # The existing rule identity and warning level cover workflows, images, and actions.
  - exit: success
    violations:
      - {rule: gha-workflow-contents-read, level: warning, path: .github/workflows/bad.yml}
      - {rule: gha-pin-actions-to-sha, level: warning, path: .github/workflows/bad.yml}
      - {rule: gha-pin-actions-to-sha, level: warning, path: .github/workflows/bad.yml}
      - {rule: gha-pin-actions-to-sha, level: warning, path: .github/workflows/bad.yml}
      - {rule: gha-pin-actions-to-sha, level: warning, path: .github/actions/demo/action.yml}
      - {rule: gha-workflow-has-name, level: info, path: .github/workflows/bad.yml}
