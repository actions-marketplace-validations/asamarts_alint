[package]
name = "alint-testkit"
description = "Versioned policy-test models, hermetic runner, and repository fixture tools for alint rulesets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[features]
default = []
strategies = ["dep:proptest"]

[dependencies]
alint-core.workspace = true
alint-output.workspace = true
alint-dsl.workspace = true
alint-rules.workspace = true
proptest = { workspace = true, optional = true }
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
jsonschema.workspace = true

[lints]
workspace = true
