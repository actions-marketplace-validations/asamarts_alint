<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rounded-square mark in alint indigo, white "al" lowercase inset.
       The rounded square carries the brand at the smallest favicon
       sizes; the two letters resolve from roughly 24px up. -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#4338ca"/>
  <text
    x="64"
    y="92"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="80"
    font-weight="800"
    letter-spacing="-0.02em"
    fill="#ffffff"
  >al</text>
</svg>
