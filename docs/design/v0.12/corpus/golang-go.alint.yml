# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
version: 1

# golang/go @ 33001a6225296f26b46c5e64a1df20e307790111
# Stage A case-study config for the alint v0.12 100-repo study.
#
# CONTEXT: golang/go does NOT use GitHub Actions for CI. It is developed on
# Gerrit (go.googlesource.com); presubmit/postsubmit run on LUCI + the build
# dashboard, and the source tree carries its enforced "is the tree well-formed"
# checks AS Go self-tests (cmd/dist test) rather than CI YAML. The bespoke,
# alint-shaped validations live in those self-tests:
#   - src/internal/copyright/copyright_test.go  (copyright header on every .go/.s)
#   - lib/fips140/fips140.sum                    (sha256 manifest pinning the FIPS zips)
#   - src/go/build/deps_test.go                  (import-layering firewall, declarative DAG)
#   - src/crypto/internal/fips140deps/fipsdeps_test.go (FIPS import firewall)
#   - api/next/* <-> doc/next/*stdlib/*minor pairing (cmd/relnote -check)
#   - codegen-freshness self-tests (help_test.go, zosarch_test.go, generate_test.go)
# Most of the enforced surface is tool/AST/semantic execution (gofmt, vet, go test,
# api compat, dep-graph resolution) -> deliberate non-goals (D).

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/go@v1

rules:
  # --- A: copyright-header self-check (src/internal/copyright/copyright_test.go) -------
  # Every .go and .s file under src/ must carry the BSD copyright notice in its
  # head. golang's checker reads the first 2KB and accepts "Copyright" anywhere,
  # OR one of ~13 permitted generated-file prefixes (// Code generated by ...).
  # alint file_header matches the first N lines; the generated-file allowance is a
  # C-tuning gap (would need an `allow:`/exceptions list). We scope to a high-signal
  # subtree (the std lib) to keep the header pattern clean; testdata is excluded by
  # golang's own checker (and is irrelevant to the header invariant).
  - id: go-bsd-copyright-header-src
    kind: file_header
    paths:
      - "src/**/*.go"
    lines: 6
    pattern: 'Copyright \d{4} The Go Authors\. All rights reserved\.'
    level: warning
    message: >-
      Go source files must carry the BSD copyright header
      (src/internal/copyright/copyright_test.go enforces this on every .go/.s).
    policy_url: "https://go.dev/doc/contribute#copyright"

  - id: go-bsd-copyright-header-asm
    kind: file_header
    paths:
      - "src/**/*.s"
    lines: 6
    pattern: 'Copyright \d{4} The Go Authors\. All rights reserved\.'
    level: warning
    message: >-
      Go assembly files must carry the BSD copyright header
      (src/internal/copyright/copyright_test.go).

  # --- A (via `contains`): FIPS-140 snapshot integrity manifest -----------------------
  # lib/fips140/fips140.sum pins the sha256 of each snapshot .zip; the security
  # policy sent to the FIPS lab references these digests, so "the zip MUST NOT
  # CHANGE". Enforced by `go test cmd/go/internal/fips140`.
  # NOTE: golang writes the manifest PATH-FIRST (`<path> <hex>`), the REVERSE of
  # the coreutils/go-.sum `<hex>  <path>` order that pair_hash `sums-line` parses,
  # so we use `contains` (digest-substring) here. That verifies digest PRESENCE but
  # not the path<->hash binding -> a C-tuning gap (sums-line wants a path-first flavor).
  - id: go-fips140-sum-pins-v1-0-0
    kind: pair_hash
    source: "lib/fips140/v1.0.0-c2097c7c.zip"
    target: "lib/fips140/fips140.sum"
    algorithm: sha256
    format: contains
    level: error
    message: >-
      The FIPS-140 v1.0.0 snapshot zip's sha256 must appear in lib/fips140/fips140.sum
      (digests are in the FIPS security policy and MUST NOT CHANGE).

  - id: go-fips140-sum-pins-v1-26-0
    kind: pair_hash
    source: "lib/fips140/v1.26.0.zip"
    target: "lib/fips140/fips140.sum"
    algorithm: sha256
    format: contains
    level: error
    message: >-
      The FIPS-140 v1.26.0 snapshot zip's sha256 must appear in lib/fips140/fips140.sum.

  # --- alint value-add (NOT repo-enforced as such; recorded separately) ---------------
  # The FIPS snapshot manifest must exist and carry its MUST-NOT-CHANGE banner.
  - id: go-fips140-sum-exists
    kind: file_exists
    paths: "lib/fips140/fips140.sum"
    level: info
    message: "The FIPS-140 snapshot checksum manifest should be present."

  - id: go-fips140-sum-has-immutability-banner
    kind: file_content_matches
    paths: "lib/fips140/fips140.sum"
    pattern: 'MUST NOT CHANGE'
    level: info
    message: "fips140.sum should retain its 'MUST NOT CHANGE' provenance banner."

  # api/README documents the structure invariant that api/next lines end in #nnnnn
  # and that adding api/next requires a doc/next note (cmd/relnote -check). Both
  # api/next and doc/next are absent at this pin (release-cycle reset), so the
  # pairing can't be expressed against the clone here; recorded as a file-graph
  # edge source instead. We assert the api golden-file directory + its README exist.
  - id: go-api-golden-readme-exists
    kind: file_exists
    paths: "api/README"
    level: info
    message: "The api/ golden-file directory should carry its README documenting the API-freeze rules."

  - id: go-api-go1-frozen-exists
    kind: file_exists
    paths: "api/go1.txt"
    level: info
    message: "The frozen go1 API golden file should be present (api compat baseline)."
