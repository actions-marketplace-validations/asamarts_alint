# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for jekyll/jekyll @ 202df571314ba1d18e9fccd81d12aaad4a703c38
# (v0.12 100-repo case study, Stage A).
#
# Shape: Ruby · site-generator CLI gem · bundler + rake · community (release-please).
#
# WHAT JEKYLL ENFORCES (its bespoke-validation surface) is dominated by
# tool/build execution that alint deliberately does NOT reimplement (D):
#   - Minitest + Cucumber suites           (script/test, script/cucumber)
#   - `jekyll new` + build sanity          (script/default-site)
#   - RuboCop incl. custom cops + the       (script/fmt; rubocop/jekyll/*.rb:
#     `frozen_string_literal` enforcement     NoPutsAllowed/NoPAllowed/
#     (Style/FrozenStringLiteralComment)       AssertEqualLiteralActual)
#   - check-spelling (allow/expect/reject/    (.github/workflows/spelling.yml +
#     line_forbidden patterns; sort+unique)    .github/actions/spelling/*)
#   - CodeQL (ruby + javascript)            (.github/workflows/codeql.yml)
#   - conventional-commit PR-title lint     (.github/workflows/conventional-commits.yml)
#   - docs-site build/deploy + profile      (.github/workflows/docs.yml, script/profile-docs)
# alint orchestrates these as value-add (one `command`/`command_idempotent`
# entrypoint) but wrapping a tool is NOT alint expressing the check (R2).
#
# THE ONE ENFORCED CHECK alint EXPRESSES NATIVELY (in the coverage ratio):
#   release-please version coherence — the version-of-record in
#   lib/jekyll/version.rb MUST equal the version recorded in
#   .github/release-please-manifest.json; release-please reads both and a
#   mismatch breaks the release-PR machinery (release-please.yml). One
#   declarative cross_file_value_equals.
#
# Absent categories (R6): NO per-file license headers (single root MIT
# LICENSE only) — apache-header / SPDX bundles must NOT fire. NO tracked
# Gemfile.lock (gitignored — application-vs-library convention) — the
# lockfile bundle is intentionally NOT extended. There is NO Ruby ecosystem
# bundle shipped in alint (corpus finding).
#
# Everything below the cross_file rule is alint VALUE-ADD (structure the
# repo does not independently gate on) — recorded separately, NOT in the
# A/B/C/D denominator (R3/R5).

version: 1

# test/source/_includes/tmp is a committed symlink to ../../../tmp/ (a
# fixture for Jekyll's symlink-handling tests); the target only exists at
# test-run time, so it dangles in a fresh clone and aborts the walk. Skip it.
ignore:
  - "test/source/_includes/tmp"
  - "test/source/symlink-test/**"

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/tooling/editorconfig@v1

rules:
  # ═══════════════════════════════════════════════════════════════════
  # A1 (ENFORCED) — release version coherence.
  # release-please-manifest.json's "." package version is the single
  # source release-please bumps; lib/jekyll/version.rb is what the gem
  # ships. They must agree or the release PR mints the wrong tag/gem.
  # The dotted manifest key needs bracket-form JSONPath: $['.'].
  # ═══════════════════════════════════════════════════════════════════
  - id: jekyll-version-matches-release-manifest
    kind: cross_file_value_equals
    source:
      file: lib/jekyll/version.rb
      extract: { regex: 'VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+(?:\.[A-Za-z0-9]+)*)"' }
    targets:
      files: .github/release-please-manifest.json
      extract: { json: "$['.']" }
    normalize: none
    allow_missing_target: false
    level: error
    message: >-
      Gem version {{ctx.source_value}} in lib/jekyll/version.rb must equal
      the release-please manifest version {{ctx.target_value}} in
      .github/release-please-manifest.json. Bump them together — a lone
      bump makes release-please mint the wrong tag/gem.

  # ─────────────────────────────────────────────────────────────────────
  # VALUE-ADD (NOT in the coverage ratio) — structure jekyll does not gate
  # on, but that alint can assert cheaply for a contributor.
  # ─────────────────────────────────────────────────────────────────────

  # The two vendored MIME data files are generated by script/vendor-mimes
  # and carry a "do not edit" banner. alint asserts the banner survives
  # (a hand-edit that drops it is the smell). NOTE: jekyll does NOT run a
  # `vendor-mimes && git diff --exit-code` freshness gate, so this is the
  # header-invariant, not a freshness check.
  - id: jekyll-mime-types-generated-banner
    kind: file_content_matches
    paths: lib/jekyll/mime.types
    pattern: '(?m)^# This file is generated automatically by script/vendor-mimes\.'
    level: warning
    message: "lib/jekyll/mime.types is generated by script/vendor-mimes; keep its do-not-edit banner."

  # frozen_string_literal magic comment — present on every lib/ and test/
  # .rb (143/143 at this pin). RuboCop (Style/FrozenStringLiteralComment:
  # always) is what ENFORCES it (so it is part of the D RuboCop run); this
  # asserts the same invariant declaratively as a fast pre-RuboCop guard.
  - id: jekyll-frozen-string-literal-lib
    kind: file_content_matches
    paths:
      include: ["lib/**/*.rb"]
    pattern: '\A# frozen_string_literal: true'
    level: warning
    message: "Every Ruby source under lib/ must begin with `# frozen_string_literal: true`."

  - id: jekyll-frozen-string-literal-test
    kind: file_content_matches
    paths:
      include: ["test/**/*.rb"]
    pattern: '\A# frozen_string_literal: true'
    level: warning
    message: "Every Ruby source under test/ must begin with `# frozen_string_literal: true`."

  # dependabot covers BOTH the ecosystems jekyll actually uses.
  - id: jekyll-dependabot-covers-actions
    kind: file_content_matches
    paths: .github/dependabot.yml
    pattern: '(?m)package-ecosystem:\s*"?github-actions"?'
    level: warning
    message: ".github/dependabot.yml should keep the github-actions ecosystem update enabled."

  - id: jekyll-dependabot-covers-bundler
    kind: file_content_matches
    paths: .github/dependabot.yml
    pattern: '(?m)package-ecosystem:\s*"?bundler"?'
    level: warning
    message: ".github/dependabot.yml should keep the bundler ecosystem update enabled."

  # The gem must stay MIT (LICENSE never changes — CODEOWNERS pins it as
  # "This file should never change.").
  - id: jekyll-gemspec-license-mit
    kind: file_content_matches
    paths: jekyll.gemspec
    pattern: '(?m)s\.license\s*=\s*"MIT"'
    level: warning
    message: "jekyll.gemspec must declare the MIT license."

  # Bespoke-config presence: the custom RuboCop cops, the spelling action,
  # and the release-please config are load-bearing for the gates above.
  - id: jekyll-rubocop-config-present
    kind: file_exists
    paths: .rubocop.yml
    level: warning
    message: ".rubocop.yml must exist (it wires the custom Jekyll cops + the style gate)."

  - id: jekyll-spelling-action-present
    kind: file_exists
    paths: .github/actions/spelling/expect.txt
    level: warning
    message: "The check-spelling action's expect-list must exist."

  - id: jekyll-release-please-config-present
    kind: file_exists
    paths: .github/release-please-config.json
    level: warning
    message: ".github/release-please-config.json must exist (drives the release machinery)."
