# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint config for Textualize/rich @ 46cebbb032f920eb096efbaf23cdc6fe9dd541f7
# v0.12 case-study draft. rich is a mid-size single-language Python TUI
# library (poetry build, Textualize governance). Its enforced surface is
# dominated by tool execution (black / mypy / pytest / codespell / CodeQL =
# D non-goals); the addressable surface is hygiene that the python + oss +
# ci bundles already express, plus a couple of repo-specific structure
# assertions recorded as alint value-add.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/python@v1
  - alint://bundled/ci/github-actions@v1

rules:
  # --- Value-add structure assertions (NOT in the repo's enforced surface;
  #     recorded separately per R3/R5) -------------------------------------

  # rich ships PEP 561 typing marker; the package advertises Typing :: Typed.
  - id: rich-py-typed-marker-exists
    kind: file_exists
    paths: ["rich/py.typed"]
    level: warning
    message: "rich advertises `Typing :: Typed`; the PEP 561 `rich/py.typed` marker must be shipped."
    policy_url: "https://peps.python.org/pep-0561/"

  # poetry.lock is committed for reproducible dev installs (CONTRIBUTING:
  # `poetry install`). Asserts the lockfile is present at the root.
  - id: rich-poetry-lock-exists
    kind: file_exists
    paths: ["poetry.lock"]
    root_only: true
    level: warning
    message: "rich pins dev deps via poetry; poetry.lock should be committed."

  # NOTE (case-study finding, intentionally NOT enabled): two further
  # value-add assertions were drafted but do not evaluate against the clone
  # under alint 0.11.1, so they are omitted per ruling R4 (a rule that
  # parses is not a check that fires):
  #   * provenance-header on rich/_unicode_data/unicode*.py via
  #     `file_content_matches` — the mid-basename `unicode*.py` glob matched
  #     0 files (a `**/_unicode_data/*.py` form DID evaluate but then fires
  #     on __init__.py / _versions.py which carry no banner).
  #   * `toml_path_equals`/`matches` on `$.tool.poetry.license` (and even
  #     `$.tool.poetry.name`) produced no result — the [tool.poetry] nested
  #     table is not surfaced. Recorded as a C tuning finding, not an A.

  # FAQ.md is generated by FAQtory from questions/*.question.md (faq.yml
  # declares the relationship). rich does NOT enforce freshness; assert the
  # generated FAQ exists and the questions source dir is non-empty.
  - id: rich-faq-generated-exists
    kind: file_exists
    paths: ["FAQ.md"]
    root_only: true
    level: info
    message: "FAQ.md is generated by FAQtory from questions/; it should be committed."
