# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint config for cli/cli (the GitHub CLI, `gh`), pinned at
# e6fa2faf9e3203c2caaa54dcb1526c5f093fa998.
#
# Repo shape: single-vendor (GitHub) Go CLI, module github.com/cli/cli/v2,
# build via make -> script/build.go, release via GoReleaser. Its enforced
# validation surface is DOMINATED by tool execution (go test, golangci-lint,
# gofmt, govulncheck, CodeQL, go-licenses generation, go mod tidy freshness)
# which alint treats as deliberate non-goals (D) — those stay in CI.
#
# What alint adds here:
#   1. The bundled hygiene/CI/Go/OSS baselines (existence + source hygiene).
#   2. The ONE repo-enforced *convention* alint can express declaratively:
#      AGENTS.md's hard "Never use em dashes (—)" code-style rule.
#   3. Value-add structural assertions the repo relies on but does not gate
#      on in CI (recorded separately from the coverage ratio).

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/go@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ---------------------------------------------------------------------------
  # A-item (enforced review convention, AGENTS.md "Code Style"):
  #   "Never use em dashes (—) in code, comments, or documentation; use
  #    regular dashes (-) or rewrite the sentence instead."
  # Humans/AI-agents enforce this in review (no tool gates it — the repo even
  # has live leaks in AGENTS.md and internal/featuredetection). alint expresses
  # it natively as file_content_forbidden over Go sources + Markdown docs.
  # ---------------------------------------------------------------------------
  - id: cli-no-em-dash
    kind: file_content_forbidden
    paths:
      include: ["**/*.go", "**/*.md"]
      exclude:
        - "**/testdata/**"
        - "**/fixtures/**"
        - "**/*_test.go"
        - "vendor/**"
        - ".github/actions/*/lib/**"   # linguist-generated (see .gitattributes)
    pattern: "—"
    level: warning
    message: >-
      Em dash (U+2014) found. AGENTS.md forbids em dashes in code, comments,
      and docs — use a regular hyphen (-) or rewrite the sentence.

  # ---------------------------------------------------------------------------
  # VALUE-ADD (NOT in the A/B/C coverage ratio, per R3/R5) — structure the repo
  # relies on but does not gate on in CI. Recorded to show real alint utility.
  # ---------------------------------------------------------------------------

  # The license-embed scaffold: every release-platform directory under
  # internal/licenses/embed/ must keep a PLACEHOLDER file, so `go:embed`
  # succeeds during plain `go build` (real per-platform listings are
  # generated at release time and .gitignore'd). Enforced today only by a
  # .gitignore `!PLACEHOLDER` negation, not by any check.
  - id: cli-license-embed-placeholders
    kind: for_each_dir
    select: "internal/licenses/embed/*"
    require:
      - kind: file_exists
        paths: "{path}/PLACEHOLDER"
    level: warning
    message: >-
      Each internal/licenses/embed/<goos>-<goarch>/ dir must keep a PLACEHOLDER
      file so `go:embed` works during local `go build` (real license listings
      are generated by script/licenses at release time and gitignored).

  # go.mod must declare the v2 major-version module path. The repo depends on
  # this (import paths are github.com/cli/cli/v2/...), but nothing gates it.
  - id: cli-go-mod-v2-module-path
    kind: file_content_matches
    paths: go.mod
    pattern: "(?m)^module github\\.com/cli/cli/v2$"
    level: info
    message: "go.mod must declare the v2 module path (github.com/cli/cli/v2)."

  # License-generation template the lint workflow + GoReleaser pre-build hooks
  # both depend on (script/licenses --ignore ... --template .github/licenses.tmpl).
  - id: cli-licenses-template-exists
    kind: file_exists
    paths: ".github/licenses.tmpl"
    level: info
    message: >-
      .github/licenses.tmpl is required by `make licenses` / `licenses-check`
      and the GoReleaser pre-build hook that embeds third-party licenses.
