# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# redis/redis @ 230c651c8907c88d43c0ba51d29f75e8eb353f66
# Shape: C-tier systems/DB, C (make-based), single-vendor (Redis Ltd.).
#
# ── What redis ENFORCES (the case-study denominator, per R5) ─────────────
# redis's CI is almost entirely COMPILE + TEST + SANITIZER execution (D):
#   ci.yml ............ make -Werror (gcc/clang, 32bit, libc-malloc, debian-old,
#                       centos, macos, old-gcc-4.8) + runtest + asan
#   daily.yml ......... the same across arm/jemalloc/fortify/io-threads/tls +
#                       valgrind×4 + asan/msan/ubsan/tsan + freebsd/alpine/centos
#                       + force-defrag + vectorset  (all build/test → D)
#   coverity.yml ...... Coverity static analysis (D)
#   codeql-analysis ... CodeQL cpp (D)
#   codecov.yml ....... lcov coverage upload (D)
#   spell-check.yml ... codespell (NLP spell → D)
#   reply-schemas-linter.yml ... ajv compile of each src/commands/*.json
#                       reply_schema (JSON-Schema meta-validity → D)
#   daily reply-schemas-validator ... req-res-log-validator.py runtime check (D)
#
# The ONE non-execution enforced check is codegen freshness:
#   ci.yml:23-28  `touch src/commands/ping.json; make commands.def; git diff`
#   → src/commands.def (tracked, generated) must match utils/generate-command-code.py
#     run over src/commands/*.json. The generator MUTATES the file in place
#     (f.write), so `generated_file_fresh` (stdout-only, v0.10) does NOT fit;
#     this is the corpus's mutating-generator-freshness gap (B — see record).
#     Shelled out below for single-entrypoint parity; the freshness LOGIC is
#     still a NEW-primitive gap, not alint expressing it (R2).
#
# redis has NO enforced code-format / trailing-whitespace / EOF / SPDX-header
# / lockfile / cross-file-version gate — recorded as absent categories (R6).
#
# ── alint VALUE-ADD (NOT in the coverage ratio, per R3/R5) ───────────────
# Everything below the "value-add" banner is structure redis does not gate
# on. Recorded separately; it is why this config carries repo rules though
# the enforced addressable surface is ~1.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/ci/github-actions@v1

rules:
  # ════════════════════════════════════════════════════════════════════════
  # ENFORCED — codegen freshness (the one non-execution gate; B-shaped)
  # ci.yml `validate commands.def up to date`. The generator writes the file
  # in place, so this is a shell-wrap (orchestration value), NOT alint
  # expressing the freshness logic — the gap is a mutating-generator mode.
  # ════════════════════════════════════════════════════════════════════════
  - id: redis-commands-def-fresh
    kind: command
    paths: "src/commands.def"
    command: ["bash", "-c", "touch src/commands/ping.json && make -s commands.def && test -z \"$(git diff -- src/commands.def)\""]
    timeout: 300
    level: error
    message: |
      src/commands.def must match utils/generate-command-code.py over
      src/commands/*.json (CI: ci.yml `validate commands.def up to date`).
      Shell-wrapped because the generator mutates in place; the freshness
      LOGIC is a new-primitive gap (mutating-generator generated_file_fresh).

  # ════════════════════════════════════════════════════════════════════════
  # VALUE-ADD ▼  (structure redis does not gate on — excluded from coverage)
  # ════════════════════════════════════════════════════════════════════════

  # The generated source carries a "do not edit" banner — assert it stays.
  - id: redis-commands-def-banner
    kind: file_content_matches
    paths: "src/commands.def"
    pattern: 'Automatically generated by generate-command-code\.py, do not edit\.'
    level: info
    message: "src/commands.def should keep its generator banner."

  # .gitattributes pins the commands.c merge driver to binary (the documented
  # rebuild-on-merge invariant). Assert the line is present.
  - id: redis-gitattributes-commands-merge
    kind: file_content_matches
    paths: ".gitattributes"
    pattern: 'src/commands\.c\s+merge=binary'
    level: info
    message: ".gitattributes must keep `src/commands.c merge=binary` (rebuild-on-merge invariant)."

  # codespell config + ignore-list exist (the spell-check job depends on them).
  - id: redis-codespell-config-exists
    kind: file_exists
    paths: [".codespell/.codespellrc", ".codespell/wordlist.txt", ".codespell/requirements.txt"]
    level: info
    message: "The Spellcheck CI job reads .codespell/.codespellrc + wordlist.txt."

  # The reply-schema linter reads every src/commands/*.json; assert the dir
  # is populated (orphan-guard: an empty dir would silently pass the linter).
  - id: redis-command-schemas-present
    kind: file_exists
    paths: ["src/commands/get.json", "src/commands/set.json", "src/commands/ping.json"]
    level: info
    message: "src/commands/ must hold the command JSON the reply-schema linter + codegen consume."

  # Top-level governance / project docs redis actually ships.
  - id: redis-governance-docs
    kind: file_exists
    paths: ["CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "MANIFESTO", "REDISCONTRIBUTIONS.txt"]
    level: info
    message: "redis ships CONTRIBUTING / CODE_OF_CONDUCT / SECURITY / MANIFESTO / REDISCONTRIBUTIONS."

  # The tri-license file is large + present (RSALv2/SSPLv1/AGPLv3).
  - id: redis-license-tri-license
    kind: file_content_matches
    paths: "LICENSE.txt"
    pattern: "Redis Source Available License|Server Side Public License|GNU AFFERO GENERAL PUBLIC LICENSE"
    level: info
    message: "LICENSE.txt should declare the RSALv2/SSPLv1/AGPLv3 tri-license."
