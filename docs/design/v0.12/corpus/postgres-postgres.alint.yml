# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint case-study config — postgres/postgres @ 4b0bf0788b066a4ca1d4f959566678e44ec93422
# (v0.12 100-repo study; shape C · systems/DB · make+autoconf+meson · PGDG/community)
#
# Postgres' enforced surface is dominated by build/test/sanitizer execution that
# alint does not reimplement (D). The genuinely-addressable, machine-checkable
# items below are: (A1) version-literal coherence between the two build systems,
# (A2/A3) the .gitattributes -> generate_editorconfig.py codegen-freshness
# reminder, plus a small set of value-add structure/hygiene assertions postgres
# does NOT itself gate on (recorded separately from the coverage ratio).

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/hygiene/no-tracked-artifacts@v1

rules:
  # ============================================================== A items
  # A1 — version-literal coherence across the two build systems.
  # `src/tools/version_stamp.pl` hand-syncs the PG version into exactly
  # configure.ac (AC_INIT) and meson.build (project version:). The twin of
  # tokio's MSRV A1 — one enforced cross-file value equality.
  - id: pg-version-configure-meson-coherent
    kind: cross_file_value_equals
    source:
      file: configure.ac
      extract:
        regex: "AC_INIT\\(\\[PostgreSQL\\], \\[([0-9A-Za-z.]+)\\]"
    targets:
      files: meson.build
      extract:
        regex: "version: '([0-9A-Za-z.]+)',"
    level: error
    message: "PostgreSQL version must match between configure.ac (AC_INIT) and meson.build (project version:); run src/tools/version_stamp.pl."

  # A2 — .editorconfig is a GENERATED artifact. src/tools/generate_editorconfig.py
  # derives it from .gitattributes; the .gitattributes line-1 banner enforces
  # "after updating this file, also run the generator". Assert the banner is
  # present so the generation contract is not silently dropped. (The full
  # codegen-freshness diff is the B item below — generated_file_fresh diffs a
  # generator's stdout, but this generator writes the file in place.)
  - id: pg-gitattributes-regen-banner
    kind: file_content_matches
    paths: [".gitattributes"]
    pattern: "run src/tools/generate_editorconfig\\.py"
    level: warning
    message: ".gitattributes must keep the 'after updating, run generate_editorconfig.py' banner so .editorconfig stays in sync."

  # A3 — the generated .editorconfig must carry the header the generator emits
  # (`root = true` + `indent_size = tab`), i.e. it is the generator's output and
  # not a hand-edited file. Cheap structural witness of the codegen pairing.
  - id: pg-editorconfig-is-generated-shape
    kind: file_content_matches
    paths: [".editorconfig"]
    pattern: "root = true"
    level: info
    message: ".editorconfig is generated by src/tools/generate_editorconfig.py from .gitattributes; do not hand-edit (regenerate instead)."

  # ============================================================== value-add
  # (NOT in the coverage ratio — postgres does not gate on these; recorded as
  #  alint value-add per R3/R5.)

  # Both build systems must remain present (autoconf + meson are co-maintained).
  - id: pg-both-build-systems-present
    kind: file_exists
    paths: ["configure.ac"]
    root_only: true
    level: info
    message: "configure.ac (autoconf build) must exist alongside meson.build."

  - id: pg-meson-build-present
    kind: file_exists
    paths: ["meson.build"]
    root_only: true
    level: info
    message: "meson.build (meson build) must exist alongside configure.ac."

  # The CI definition + its referenced compute/base config must exist.
  - id: pg-cirrus-ci-present
    kind: file_exists
    paths: [".cirrus.yml", ".cirrus.tasks.yml", ".cirrus.star"]
    root_only: true
    level: info
    message: "Cirrus CI definition files (.cirrus.yml / .cirrus.tasks.yml / .cirrus.star) must exist."

  - id: pg-ci-base-conf-present
    kind: file_exists
    paths: ["src/tools/ci/pg_ci_base.conf"]
    level: info
    message: "src/tools/ci/pg_ci_base.conf (referenced by every CI task as TEMP_CONFIG) must exist."

  # COPYRIGHT file is the canonical PGDG notice that copyright.pl keeps current.
  - id: pg-copyright-file-present
    kind: file_exists
    paths: ["COPYRIGHT"]
    root_only: true
    level: info
    message: "Top-level COPYRIGHT (PostgreSQL Global Development Group notice) must exist."

  - id: pg-copyright-mentions-pgdg
    kind: file_content_matches
    paths: ["COPYRIGHT"]
    pattern: "PostgreSQL Global Development Group"
    level: info
    message: "COPYRIGHT must name the PostgreSQL Global Development Group."

  # The pinned perltidy version is a documented coherence convention (pgindent
  # README + perltidyrc): "be sure it is version 20230309 ... we want consistency".
  - id: pg-perltidy-version-pinned
    kind: file_content_matches
    paths: ["src/tools/pgindent/README"]
    pattern: "20230309"
    level: info
    message: "pgindent README must pin the exact perltidy version (20230309) for formatting consistency."
