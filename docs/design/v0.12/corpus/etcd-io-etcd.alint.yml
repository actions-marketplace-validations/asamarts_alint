# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# alint config for etcd-io/etcd @ 9ed485d3e37bbdddff471f5c6d6d7f62048c07d1
# (v0.12 100-repo case study — Stage A).
#
# etcd is a CNCF Go multi-module workspace (13 go.mod modules under one
# go.work) built with make + a large hack of bespoke `scripts/verify_*`
# checks orchestrated by the Makefile `verify` target and run on Prow
# (`pull-etcd-verify`). Most of that surface is tool execution (golangci-lint,
# gomodguard, shellcheck, yamllint, markdownlint, go mod tidy, govulncheck,
# license-bill-of-materials, codegen-freshness diffs) which alint does NOT
# reimplement (bucket D). The natively-expressible slice is the cross-file
# Go-version coherence, the shell-indentation hygiene rule, and the Apache
# per-file source header — expressed below.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/go@v1
  - alint://bundled/ci/github-actions@v1          # no-op gate: etcd runs CI on Prow, not GH Actions
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  # etcd IS Apache-2.0 and every .go file carries the canonical
  # "Copyright <yr> The etcd Authors / Licensed under the Apache License,
  # Version 2.0 ..." header, which the apache-2 bundle's file_header pattern
  # matches. NOTE: etcd ships a full Apache LICENSE but deliberately has NO
  # NOTICE file, so apache-2-notice-file-exists fires as a real (recorded)
  # finding, not a config bug.
  - alint://bundled/compliance/apache-2@v1

rules:
  # === A-items: natively-expressed enforced checks ====================

  # verify-go-versions (scripts/verify_go_versions.sh): the `toolchain`
  # directive in every go.mod AND go.work must equal the single source of
  # truth `.go-version`. This is the cross-file value-coherence check etcd
  # enforces on Prow; alint expresses it directly.
  - id: etcd-go-toolchain-matches-go-version
    kind: cross_file_value_equals
    source:
      file: ".go-version"
      extract: { regex: '^\s*(\d+\.\d+\.\d+)' }
    targets:
      files: "**/go.mod"
      extract: { regex: '(?m)^toolchain go(\d+\.\d+\.\d+)' }
    normalize: none
    allow_missing_target: false
    level: error
    message: >-
      Go toolchain in {{ctx.target}} ({{ctx.target_value}}) must equal the
      pin in .go-version ({{ctx.source_value}}). Run
      `make sync-toolchain-directive` (see scripts/verify_go_versions.sh).
    policy_url: "https://github.com/etcd-io/etcd/blob/main/scripts/verify_go_versions.sh"

  # The same coherence applied to go.work's `toolchain` directive
  # (verify_go_versions.sh special-cases go.work because `go work edit
  # -json` omits the toolchain).
  - id: etcd-go-work-toolchain-matches-go-version
    kind: cross_file_value_equals
    source:
      file: ".go-version"
      extract: { regex: '^\s*(\d+\.\d+\.\d+)' }
    targets:
      files: "go.work"
      extract: { regex: '(?m)^toolchain go(\d+\.\d+\.\d+)' }
    normalize: none
    allow_missing_target: false
    level: error
    message: >-
      Go toolchain in go.work ({{ctx.target_value}}) must equal the pin in
      .go-version ({{ctx.source_value}}). Run `make sync-toolchain-directive`.
    policy_url: "https://github.com/etcd-io/etcd/blob/main/scripts/verify_go_versions.sh"

  # verify-shellws (scripts/test.sh shellws_pass): no tab-based indentation
  # in any shell script (the repo mandates two-space indent). Enforced
  # repo-wide via `find . -name '*.sh' | xargs grep -E '^\s*\t'`.
  - id: etcd-shell-no-tab-indent
    kind: file_content_forbidden
    paths: "**/*.sh"
    pattern: '(?m)^[ ]*\t'
    level: error
    message: >-
      Shell scripts must use two-space indentation, not tabs
      (scripts/test.sh shellws_pass). Run `make fix-shell-ws`.

  # === alint value-add: structure the repo relies on but does not gate ===

  # go.work is generated by scripts/update_go_workspace.sh and carries a
  # "do not edit" banner; assert the banner is present so a hand-edit that
  # drops it is caught.
  - id: etcd-go-work-generated-banner
    kind: file_content_matches
    paths: "go.work"
    pattern: 'This is a generated file\. Do not edit directly\.'
    level: warning
    message: "go.work is generated (scripts/update_go_workspace.sh); keep the generated-file banner."

  # License-header source-of-truth template lives at .header; assert it
  # exists (golangci-lint goheader enforces the header against this text).
  - id: etcd-license-header-template-exists
    kind: file_exists
    paths: ".header"
    root_only: true
    level: info
    message: ".header is the canonical Apache license-header template enforced by golangci-lint goheader."

  # Cross-module import firewall declared per library module via
  # .gomodguard.yaml (e.g. api/ must not depend on server/). The policy
  # DECLARATION existing is alint value-add; gomodguard enforces it on Prow.
  - id: etcd-gomodguard-config-present
    kind: file_exists
    paths: ["api/.gomodguard.yaml", "server/.gomodguard.yaml", "client/v3/.gomodguard.yaml", "pkg/.gomodguard.yaml"]
    level: info
    message: ".gomodguard.yaml declares the per-module import firewall (verify-gomodguard)."

  # SBOM: bill-of-materials.json is regenerated and diffed by verify-bom.
  - id: etcd-bom-present
    kind: file_exists
    paths: "bill-of-materials.json"
    root_only: true
    level: info
    message: "bill-of-materials.json is the dependency-license SBOM checked by verify-bom."

  # DCO sign-off is mandated by CONTRIBUTING; the DCO text must be present.
  - id: etcd-dco-present
    kind: file_exists
    paths: "DCO"
    root_only: true
    level: info
    message: "DCO present; CONTRIBUTING mandates Signed-off-by on every commit."

  # CNCF OWNERS-based review (no GitHub CODEOWNERS); root OWNERS must exist.
  - id: etcd-owners-present
    kind: file_exists
    paths: "OWNERS"
    root_only: true
    level: info
    message: "Kubernetes/Prow-style OWNERS file drives review assignment."
