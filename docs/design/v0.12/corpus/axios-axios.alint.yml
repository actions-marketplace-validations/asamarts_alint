# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Proposed alint config for axios/axios — v0.12 case study (Stage A).
# Pinned commit 4306df21e84332fc576e98c2de549347c06bfb76.
#
# axios is a mid-size single-language JS HTTP library (npm, community
# governance). Its ENFORCED validation surface is dominated by tool
# execution (eslint, prettier, vitest unit/browser, CJS/ESM/Bun/Deno
# smoke+module suites, rollup build, bundle-size, build-reproducibility
# two-pass sha diff, lockfile-lint, commitlint, zizmor) — all D
# non-goals alint can orchestrate but does not reimplement.
#
# What alint expresses NATIVELY here (the A surface) is the small set of
# cross-file / structure / hygiene invariants the project hand-maintains:
#   - the load-bearing `.npmrc` ignore-scripts=true install-safety flag
#     ("do not remove" — AGENTS.md, COLLABORATOR_GUIDE.md, copilot-instructions)
#   - VERSION coherence: lib/env/data.js (gulp-generated) == package.json version
#   - package.json export/`files` paths into lib/ resolve to real source
#   - CLAUDE.md is the @AGENTS.md pointer stub
#
# Genuine NON-replaceables (left to the right tool): the entire test/build/
# lint/typecheck matrix, lockfile-lint's per-entry https+integrity graph walk,
# bundle-size, build reproducibility, commitlint conventional-commits, zizmor.
#
# Known GAP (recorded as a new-kind candidate, NOT expressed here): the
# documented "keep AGENTS.md and .github/copilot-instructions.md in sync"
# convention (shared safety subset + `:surfer:` AI-marker rule) — neither
# pair_hash (digest-in-manifest) nor cross_file_value_equals (single value)
# nor pair (existence) expresses cross-file shared-section equivalence.

version: 1

extends:
  - alint://bundled/oss-baseline@v1
  - alint://bundled/node@v1

rules:
  # ═══════════════════════════════════════════════════════════════════
  # A1 — install-time safety flag is load-bearing and must not be removed.
  # "Do not remove ignore-scripts=true" is stated in AGENTS.md,
  # COLLABORATOR_GUIDE.md, and .github/copilot-instructions.md, and is the
  # backbone of axios's supply-chain posture (THREATMODEL.md). A human
  # convention with no tool gate today.
  # ═══════════════════════════════════════════════════════════════════
  - id: axios-npmrc-ignore-scripts
    kind: file_content_matches
    paths: .npmrc
    pattern: '(?m)^ignore-scripts=true\s*$'
    level: error
    message: >-
      .npmrc must keep `ignore-scripts=true`; removing it weakens
      install-time supply-chain safety (see AGENTS.md / THREATMODEL.md).

  # ═══════════════════════════════════════════════════════════════════
  # A2 — VERSION coherence. lib/env/data.js is generated by `gulp env`
  # from package.json version (gulpfile.js:60-75). The committed
  # `export const VERSION = "x.y.z"` must equal package.json $.version.
  # Expressed as value coherence (no need to run the generator).
  # ═══════════════════════════════════════════════════════════════════
  - id: axios-version-data-matches-package
    kind: cross_file_value_equals
    source:
      file: package.json
      extract: { json: "$.version" }
    targets:
      files: "lib/env/data.js"
      extract: { regex: 'export const VERSION = "([0-9]+\.[0-9]+\.[0-9]+[^"]*)"' }
    normalize: none
    allow_missing_target: false
    level: error
    message: >-
      lib/env/data.js VERSION must equal package.json version
      (it is regenerated by `gulp env`; a stale value ships the wrong
      version string in the bundle banner).

  # ═══════════════════════════════════════════════════════════════════
  # A3 — package.json export targets into lib/ resolve to real source.
  # The `exports` map and `files[]` reference committed lib/*.js entry
  # points (the documented `./unsafe/*` subpath exports). A typo or a
  # moved/renamed helper would break the published subpath silently.
  # (dist/ targets are build output — gitignored — so we extract only
  # the lib/ paths.)
  # ═══════════════════════════════════════════════════════════════════
  - id: axios-package-exports-lib-paths-resolve
    kind: registry_paths_resolve
    source: package.json
    extract:
      # The exports / browser / react-native maps quote paths as "./lib/...".
      # Capture group 1 is the resolvable path (12 distinct lib/*.js entries).
      regex: '"(\./lib/[A-Za-z0-9/._-]+\.js)"'
    base: "."
    expect: file
    level: error
    message: >-
      Every lib/*.js path referenced from package.json (exports / browser
      / react-native maps) must resolve to a real source file.

  # ═══════════════════════════════════════════════════════════════════
  # A4 — CLAUDE.md is the canonical-guide pointer stub. AGENTS.md is the
  # single source of truth; CLAUDE.md must remain the `@AGENTS.md`
  # include so the two never drift into two guides.
  # ═══════════════════════════════════════════════════════════════════
  - id: axios-claude-md-points-to-agents
    kind: file_content_matches
    paths: CLAUDE.md
    pattern: '(?m)^@AGENTS\.md\s*$'
    level: warning
    message: >-
      CLAUDE.md must stay the `@AGENTS.md` pointer stub (AGENTS.md is the
      canonical contributor guide; do not fork a second copy).

  # ═══════════════════════════════════════════════════════════════════
  # VALUE-ADD (recorded, not a repo-enforced gate): assert the build's
  # security-sensitive docs are present so they cannot be silently dropped.
  # axios does not gate on these existing, so they are alint value-add.
  # ═══════════════════════════════════════════════════════════════════
  - id: axios-threatmodel-exists
    kind: file_exists
    paths: THREATMODEL.md
    root_only: true
    level: info
    message: "THREATMODEL.md (the documented runtime/supply-chain threat model) should be present."

  - id: axios-agents-guide-exists
    kind: file_exists
    paths: AGENTS.md
    root_only: true
    level: info
    message: "AGENTS.md is the canonical contributor/AI guide; keep it present."
