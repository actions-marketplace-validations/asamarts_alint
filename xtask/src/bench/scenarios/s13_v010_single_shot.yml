# Scenario S13 — v0.10 single-shot dispatch class.
#
# Two rule kinds (generated_file_fresh / command_idempotent)
# each run once per check regardless of N, shelling out to a
# user-declared program. Benching the shelled-out program is
# not a useful signal — every kind in this class uses
# `command: ["true"]` (POSIX no-op) so the row measures
# `crate::spawn::run_capturing` (fork + exec + concurrent
# pipe-drain + wait + stdout-parse) for one invocation, not
# the user's tool.
#
# The single-shot rules add a fixed cost per run; the tree
# walk dominates the row. The signal of interest is cross-
# version stability of the spawn path — regressions in
# crate::spawn or the engine's dispatch glue would show up
# as a sustained delta.
#
# Adds to S5 (fix-pass throughput, the only other scenario
# touching process-spawning machinery indirectly) by directly
# covering the v0.10 spawn-capable rule kinds.

version: 1

rules:
  # The committed `.gff_target` (overlay-written by run.rs as
  # a 0-byte file) must equal the generator's stdout. The
  # generator is `true` -> empty stdout -> equals empty file
  # content -> silent. Exercises gff's spawn + pipe-drain +
  # diff machinery.
  - id: gff-true
    kind: generated_file_fresh
    file: .gff_target
    command: ["true"]
    level: info

  # `true` exits 0 with no output -> command_idempotent is
  # silent. Exercises the no-files-from spawn path.
  - id: ci-true
    kind: command_idempotent
    command: ["true"]
    level: info
