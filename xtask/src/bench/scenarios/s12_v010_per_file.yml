# Scenario S12 — v0.10 per-file dispatch class.
#
# Three rule kinds (ordered_block / import_gate / xml_path_*)
# exercise the per-file fan-out the v0.9.3 work made fast.
# ordered_block + import_gate scan **/*.rs (the synthetic
# tree's primary file population); xml_path_* runs against
# one root-level .csproj (overlay-written by run.rs).
#
# Adds to S6 (dense per-file content fan-out on **/*.rs) by
# covering the v0.10 per-file additions — block-ordering,
# import-firewalling, and the XML structured-query path.
# Regressions in the per-file dispatch loop or in the new
# extraction / regex / XML paths surface here independently
# of S6's purely-content baseline.

version: 1

rules:
  # Keep-sorted blocks in every .rs file. The synthetic files
  # contain no `// alint:keep-sorted` markers, so the rule
  # scans each file once and stays silent. Cost is the marker
  # scan in the per-file dispatch loop.
  - id: rs-keep-sorted
    kind: ordered_block
    paths: "**/*.rs"
    start: "// alint:keep-sorted start"
    end: "// alint:keep-sorted end"
    level: info

  # Forbid imports from a hypothetical internal namespace.
  # The Rust-preset extractor walks every `.rs` file's
  # `use ...;` lines; the synthetic files have no matching
  # imports, so the rule is silent. Cost is the per-file
  # preset-regex extraction pass.
  - id: rs-no-internal-imports
    kind: import_gate
    paths: "**/*.rs"
    language: rust
    forbid: "^crates::internal::.*$"
    level: info

  # XML structured-query coverage. `paths` matches the one
  # root-level .csproj written by the S12 overlay; both
  # rules check fixed values that the overlay's content
  # satisfies, so they stay silent. Cost is one XML parse
  # plus the JSONPath traversal per row — fixed-O(1) at
  # scale.
  - id: csproj-sdk-style
    kind: xml_path_matches
    paths: "*.csproj"
    path: "$.Project['@Sdk']"
    matches: "^Microsoft\\.NET\\.Sdk$"
    if_present: true
    level: info

  - id: csproj-target-framework
    kind: xml_path_equals
    paths: "*.csproj"
    path: "$.Project.PropertyGroup.TargetFramework"
    equals: "net8.0"
    if_present: true
    level: info
