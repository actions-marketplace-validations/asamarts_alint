# Scenario S14 — v0.12 net-new featureset (comprehensive).
#
# A single deliberately-mixed scenario that exercises EVERY file-shape
# rule kind / mode added in the v0.12 cycle, so one bench row catches a
# regression anywhere in the v0.12 surface. (S11-S13 are per-dispatch-
# class; this one is per-feature-set — the v0.12 analogue of "run the
# whole new vocabulary over the macro tree once".)
#
# Covered (all six run SILENT on the synthetic tree, so the row measures
# the dispatch WORK, not violation emission):
#   1. file_graph + require: no_dangling (from_content edges)   [the new
#      whole-index graph dispatch class — reads every node, extracts +
#      resolves refs; the per-node read+extract+resolve is the dominant
#      cost at scale, even though the lorem .rs yield an empty graph].
#   2. file_graph + derive_target + require: no_dangling         [#3 —
#      the v0.12 decouple; derives a sibling from each node PATH (no file
#      read) and checks existence].
#   3. for_each_match                                            [#5 —
#      the new in-file line quantifier; per-line select scan over every
#      *.rs line].
#   4. cross_file source.files glob-union + set_equals           [#2 —
#      unions an extracted value across a glob of manifests; the glob-
#      fan-out read is the new cost].
#   5. ordered_block markerless (no start/end markers)           [#4 —
#      whole-file sort scan].
#   6. generated_file_fresh mutating `outputs:` mode             [the in-
#      place snapshot -> run -> diff -> restore path; command: ["true"]
#      so the row measures the snapshot/restore I/O, not a user tool].
#
# Excluded by design: the git-extract kinds (pair_changed_together /
# changeset_requires_path) compare against a `since:` ref (origin/main)
# the synthetic one-commit tree does not model; their git-diff dispatch
# is the git-tree class S8 covers. The remaining v0.12 work is extract/
# normalize refinements (jsonc / sums-line / case-fold) with no distinct
# dispatch shape, exercised transitively by S11 + the rules above.
#
# Overlay (see Scenario::setup_overlay): a one-line `.v012_editions`
# file holding `2024` — the set every member crate's edition unions to,
# so rule 4 is set_equals-silent. gff (rule 6) snapshots the root
# Cargo.toml (no other rule scopes to it, so no interference).

version: 1

rules:
  # 1. Whole-index file graph. `from_content` reads every node and runs
  #    the extract; the synthetic lorem sources declare no `use … ;`, so
  #    the graph is empty and `no_dangling` is silent — but the per-node
  #    read + extract + resolve (the cost that scales) is fully incurred.
  - id: v012-graph-no-dangling
    kind: file_graph
    nodes: "crates/*/src/*.rs"
    edges:
      from_content:
        extract:
          regex: 'use\s+([\w:]+);'
        resolve: relative_to_repo_root
    require: no_dangling
    level: info

  # 2. derive_target + no_dangling (the v0.12 decouple): every member's
  #    Cargo.toml must have its sibling README.md. Derived purely from the
  #    node path (no file read); README.md exists per package -> silent.
  - id: v012-graph-derive-sibling
    kind: file_graph
    nodes: "crates/*/Cargo.toml"
    edges:
      derive_target:
        from: 'crates/(.*)/Cargo\.toml'
        to: 'crates/$1/README.md'
    require: no_dangling
    level: info

  # 3. for_each_match — per-line scan over every source line. `select`
  #    picks the (many) lines that start with a letter; the trivially-true
  #    `matches: ['.']` keeps it silent. Exercises the per-line dispatch.
  - id: v012-for-each-match
    kind: for_each_match
    paths: "crates/*/src/*.rs"
    select: '^[A-Za-z]'
    require:
      matches: ['.']
    level: info

  # 4. cross_file glob-union source. Reads every member Cargo.toml and
  #    UNIONS the extracted edition; all members are edition 2024, so the
  #    union is {2024} and set_equals against the `.v012_editions` overlay
  #    is silent. Cost is the N-file fan-out read + extract + set union.
  - id: v012-glob-union-source
    kind: cross_file
    source:
      files: "crates/*/Cargo.toml"
      extract:
        toml: "$.package.edition"
    targets:
      - file: .v012_editions
        extract:
          lines: {}
    relation: set_equals
    level: info

  # 5. ordered_block markerless: no start/end markers, so the WHOLE file
  #    is the sorted region. Each README's two non-blank lines (`# pkg-…`
  #    then `Synthetic …`) are in lexical order -> silent. Exercises the
  #    whole-file line scan.
  - id: v012-markerless-ordered-block
    kind: ordered_block
    paths: "crates/*/README.md"
    comparator: lexical
    level: info

  # 6. generated_file_fresh mutating `outputs:` mode. Snapshots the root
  #    Cargo.toml, runs the no-op generator (`true`), diffs (unchanged),
  #    restores. command: ["true"] isolates the snapshot/restore I/O from
  #    any real tool. Single-shot.
  - id: v012-gff-mutating
    kind: generated_file_fresh
    outputs: "Cargo.toml"
    command: ["true"]
    level: info
