# Scenario S11 — v0.10 cross-file dispatch class.
#
# Three rule kinds (registry_paths_resolve / cross_file_value_equals
# / pair_hash) run over the regular synthetic monorepo. Each
# exercises the whole-repo dispatch path the v0.10 cross-file
# engine entry points use, plus the new crate::extract,
# crate::io read-cap, and the workspace-Cargo.toml discovery
# the synthetic tree already produces.
#
# Adds to S7 (v0.2 cross-file kinds: pair / unique_by /
# for_each_* / dir_only_contains / every_matching_has) by
# covering the v0.10 additions. Catches regressions in the
# v0.10 whole-repo entry points that S7 wouldn't surface.

version: 1

rules:
  # Workspace Cargo.toml declares `[workspace].members =
  # ["crates/*"]`. With `entries_are_globs: true` the single
  # entry expands to every member directory, all of which exist
  # in the synthetic tree, so the rule scans the registry +
  # walks the full index per expanded entry and stays silent.
  # Cost is the registry parse + glob expansion + per-match
  # existence check at scale.
  - id: registry-members-resolve
    kind: registry_paths_resolve
    source: Cargo.toml
    extract:
      toml: "$.workspace.members"
    entries_are_globs: true
    expect: dir
    level: warning

  # The first member crate's `[package].edition` ("2024") is
  # the source pin; every member Cargo.toml must agree. All
  # generator-produced members carry the same edition value,
  # so the rule is silent — cost is N file reads + N TOML
  # parses + N value comparisons against the source's parse.
  - id: edition-pins-across-members
    kind: cross_file_value_equals
    source:
      file: crates/pkg-000000/Cargo.toml
      extract:
        toml: "$.package.edition"
    targets:
      files: "crates/*/Cargo.toml"
      extract:
        toml: "$.package.edition"
    level: warning

  # A root-level `manifest.sha256` (overlay-written by run.rs)
  # carries one all-zeros sha256 hex; pair_hash hashes every
  # member Cargo.toml and looks the digest up in the target.
  # The overlay's single hex matches no real source, so every
  # source flags `digest not found in target`. Cost is the
  # per-source hash + per-source target scan.
  - id: members-hashed-in-manifest
    kind: pair_hash
    source: "crates/*/Cargo.toml"
    target: manifest.sha256
    level: info
