name: editors e2e (VS Code LSP integration)

# Real-client end-to-end for the editor integrations: launches a real
# VS Code under Xvfb, points it at an `alint` binary built from this
# branch (via the `alint.path` setting), and asserts the extension
# surfaces diagnostics + an apply-fix quick action from the `alint lsp`
# language server.
#
# Runs on GitHub-hosted ubuntu-latest, which ships the GUI libraries +
# xvfb that @vscode/test-electron needs (the self-hosted bench runner is
# headless-minimal). Gated on the editors, the LSP server, or the binary
# so a server<->client contract change re-runs the real-client check.

# NOTE: manual-dispatch only for now. The real-client VS Code e2e does
# not yet pass under headless CI: the extension host disposes its
# connection mid-`client.start()` (an `Unexpected SIGPIPE` in the host),
# reproduced on both GitHub-hosted ubuntu-latest and locally, and NOT
# fixed by --no-sandbox / dbus-run-session / telemetry-off / a pinned VS
# Code version. The `alint lsp` server itself is healthy (proven by a
# raw-stdio probe and the green Layer-0 protocol tests in
# crates/alint/tests/lsp_*). Kept dispatch-only so it can't red PRs
# while the headless-activation issue is investigated; flip the
# pull_request trigger back on once it goes green.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VS Code extension (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - name: Build alint from this branch
        run: cargo build --release -p alint

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: VS Code e2e (xvfb)
        working-directory: editors/vscode
        env:
          # The extension resolves this via the `alint.path` setting
          # written into the temp fixture workspace by runTest.ts.
          ALINT_TEST_BINARY: ${{ github.workspace }}/target/release/alint
        run: |
          npm ci
          xvfb-run -a npm run test:e2e
