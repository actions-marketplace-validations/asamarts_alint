# Corpus replay: `alint check` over the 110-repository v0.12 case-study corpus
# at its pinned commits (docs/design/v0.12/corpus/pins.tsv), with every
# spawning rule removed so no third-party command runs. See
# `cargo run -p xtask -- corpus-replay --help`.
#
# v0.21's shadow port of `cross_file` `equals` is checked here (ADR-0023,
# decision V21-7): before each release that contains IR changes, dispatch this
# workflow and require zero differences (RELEASING.md). `compare_ref` builds a
# second binary from that ref and fails on any report that differs.
#
# It runs on the canonical bench host's runner, which executes one job at a
# time, so a replay never overlaps a benchmark. The repository cache lives on
# that host and is reused by every run.
name: Corpus Replay

on:
  workflow_dispatch:
    inputs:
      compare_ref:
        description: "Optional git ref: build its release binary and fail on any report that differs from this ref's"
        required: false
        default: ""
  schedule:
    - cron: "37 3 * * 2"  # weekly, Tuesday 03:37 UTC

permissions:
  contents: read

concurrency:
  group: corpus-replay
  cancel-in-progress: false

jobs:
  replay:
    name: Corpus replay
    runs-on: [self-hosted, linux, bench]
    # First run fetches 110 repositories at depth 1 and builds two release
    # binaries; later runs reuse the cache.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: corpus-replay
      - name: build alint and xtask
        run: cargo build --release --locked -p alint -p xtask
      - name: build the comparison binary
        if: ${{ inputs.compare_ref != '' }}
        env:
          COMPARE_REF: ${{ inputs.compare_ref }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/compare" "$COMPARE_REF"
          (cd "$RUNNER_TEMP/compare" && cargo build --release --locked -p alint)
          echo "COMPARE_BIN=$RUNNER_TEMP/compare/target/release/alint" >> "$GITHUB_ENV"
      - name: replay
        run: |
          args=(--alint target/release/alint
                --cache "$HOME/.cache/alint-corpus-replay"
                --jobs 4
                --out-json "$RUNNER_TEMP/corpus-replay.json"
                --summary "$GITHUB_STEP_SUMMARY")
          if [[ -n "${COMPARE_BIN:-}" ]]; then
            args+=(--compare "$COMPARE_BIN")
          fi
          target/release/xtask corpus-replay "${args[@]}"
      - name: upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corpus-replay
          path: ${{ runner.temp }}/corpus-replay.json
          if-no-files-found: ignore
      - name: remove the comparison worktree
        if: ${{ always() && inputs.compare_ref != '' }}
        run: git worktree remove --force "$RUNNER_TEMP/compare" || true
