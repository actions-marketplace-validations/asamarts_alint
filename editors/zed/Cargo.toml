[package]
name = "alint-zed"
version = "0.10.2"
edition = "2021"
publish = false
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# VERIFY-BEFORE-PUBLISH: pin to the zed_extension_api version Zed's
# registry currently builds against (Zed bumps the wasm ABI). Confirm
# with `cargo build --target wasm32-wasip1` before opening the registry PR.
zed_extension_api = "0.6.0"

# Standalone workspace so the parent alint Cargo workspace doesn't try to
# absorb this wasm cdylib crate (different target, separate Cargo.lock).
[workspace]
